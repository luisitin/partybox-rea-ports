name: P07 Paper Territory
on:
  pull_request:
    paths:
      - 'games/paper-territory/**'
      - 'jobs/P07-paper-territory/**'
      - '.github/workflows/P07.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm format
      - run: pnpm vitest run games/paper-territory --maxWorkers=1
