name: P19 Tile Tempo
on:
  pull_request:
    paths:
      - 'games/tile-tempo/**'
      - 'jobs/P19-piano-tiles-race/**'
      - '.github/workflows/P19.yml'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig*.json'
      - 'vitest.config.ts'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm format
      - run: pnpm vitest run games/tile-tempo --maxWorkers 1
      - run: pnpm exec tsx jobs/P19-piano-tiles-race/tools/simulate.ts
      - run: node jobs/P19-piano-tiles-race/tools/mutate.mjs
