name: P01 Quiz Rush
on:
  pull_request:
    paths:
      - 'games/kahoot/**'
      - 'jobs/P01-quiz-rush/**'
      - '.github/workflows/P01.yml'
permissions:
  contents: read
jobs:
  quiz-rush:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm format
      - run: pnpm vitest run games/kahoot --maxWorkers=1
