name: P08 Hole Swallow
on:
  pull_request:
    paths:
      - 'games/hole-swallow/**'
      - 'jobs/P08-hole-swallow/**'
      - '.github/workflows/P08.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm format
      - run: pnpm vitest run games/hole-swallow --maxWorkers=1
