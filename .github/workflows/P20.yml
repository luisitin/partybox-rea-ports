name: P20 Fruit Slice
on:
  pull_request:
    paths:
      - 'games/fruit-slice/**'
      - 'jobs/P20-fruit-slice/**'
      - '.github/workflows/P20.yml'
      - 'vitest.config.ts'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global corepack
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm format
      - run: pnpm vitest run games/fruit-slice --maxWorkers=1
