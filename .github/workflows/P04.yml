name: P04 Draw and Guess
on:
  pull_request:
    paths:
      - 'games/draw-and-guess/**'
      - 'jobs/P04-draw-and-guess/**'
      - '.github/workflows/P04.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable pinned pnpm
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm format
      - run: pnpm vitest run games/draw-and-guess --maxWorkers=1
