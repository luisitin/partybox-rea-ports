name: P22 Ricochet Rumble
on:
  pull_request:
    paths:
      - 'games/ricochet-rumble/**'
      - 'jobs/P22-ricochet-rumble/**'
      - '.github/workflows/P22.yml'
permissions:
  contents: read
jobs:
  ricochet-rumble:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm format
      - run: pnpm vitest run games/ricochet-rumble --maxWorkers=1
