name: P16 Skyline Stack
on:
  pull_request:
    paths:
      - 'games/stack-tower/**'
      - 'jobs/P16-stack-tower/**'
      - '.github/workflows/P16.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm format
      - run: pnpm vitest run games/stack-tower --maxWorkers=1
