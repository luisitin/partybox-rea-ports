name: P15 Doodle Climb
on:
  pull_request:
    paths:
      - 'games/doodle-climb/**'
      - 'jobs/P15-doodle-climb/**'
      - '.github/workflows/P15.yml'
permissions:
  contents: read
jobs:
  doodle-climb:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm format
      - run: pnpm vitest run games/doodle-climb --maxWorkers=1
