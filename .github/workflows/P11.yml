name: P11 Block Clash
on:
  pull_request:
    paths:
      - 'games/block-clash/**'
      - 'jobs/P11-tetris-clash/**'
      - '.github/workflows/P11.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm format
      - run: pnpm vitest run games/block-clash --maxWorkers=1
