name: P24 Haxball
on:
  pull_request:
    paths:
      - 'games/haxball/**'
      - 'jobs/P24-haxball/**'
      - '.github/workflows/P24.yml'
permissions:
  contents: read
jobs:
  haxball:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm format
      - run: pnpm vitest run games/haxball --maxWorkers=1
