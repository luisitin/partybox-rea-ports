name: P03 Quizizz
on:
  pull_request:
    paths:
      - 'games/quizizz/**'
      - 'jobs/P03-trivia-lightning/**'
      - '.github/workflows/P03.yml'
permissions:
  contents: read
jobs:
  quizizz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm format
      - run: pnpm vitest run games/quizizz --maxWorkers=1
