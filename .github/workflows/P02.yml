name: P02 Kahoot! team mode
on:
  pull_request:
    paths:
      - 'games/kahoot/**'
      - 'jobs/P02-quiz-rush-teams/**'
      - '.github/workflows/P02.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable pinned pnpm
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm format
      - run: pnpm vitest run games/kahoot --maxWorkers=1
