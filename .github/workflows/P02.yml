name: P02 Kahoot! team mode
on:
  pull_request:
    paths:
      - 'games/kahoot/**'
      - 'jobs/P02-quiz-rush-teams/**'
      - '.github/workflows/P02.yml'
permissions:
  contents: read
concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable pinned pnpm
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm format
      - run: pnpm vitest run games/kahoot --maxWorkers=1
        env:
          P02_WRITE_EVIDENCE: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: P02-runtime-evidence
          path: |
            jobs/P02-quiz-rush-teams/media/sim-*.json
            jobs/P02-quiz-rush-teams/media/property-groups.json
            jobs/P02-quiz-rush-teams/media/bot-custom-calibration-*.json
          if-no-files-found: error
