name: P21 Pong Party
on:
  pull_request:
    paths:
      - 'games/pong-party/**'
      - 'jobs/P21-pong-party/**'
      - '.github/workflows/P21.yml'
permissions:
  contents: read
jobs:
  pong-party:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm format
      - run: pnpm vitest run games/pong-party --maxWorkers=1
