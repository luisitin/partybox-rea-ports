name: P18 Colour Gate
on:
  pull_request:
    paths:
      - 'games/colour-gate/**'
      - 'jobs/P18-colour-gate/**'
      - '.github/workflows/P18.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm format
      - run: pnpm vitest run games/colour-gate --maxWorkers=1
