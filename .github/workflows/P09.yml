name: P09 Merge Sprint
on:
  pull_request:
    paths:
      - 'games/merge-sprint/**'
      - 'jobs/P09-2048-race/**'
      - '.github/workflows/P09.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm format
      - run: pnpm vitest run games/merge-sprint --maxWorkers=1
