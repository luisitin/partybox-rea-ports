name: P13 Dino Dash
on:
  pull_request:
    paths:
      - 'games/dino-dash/**'
      - 'jobs/P13-dino-dash/**'
      - '.github/workflows/P13.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm format
      - run: pnpm vitest run games/dino-dash --maxWorkers=1
