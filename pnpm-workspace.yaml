packages:
  - 'packages/*'
  - 'games'

# Dependencies whose install scripts may run (pnpm blocks all others by default).
allowBuilds:
  esbuild: true

# One place for versions that must match across packages (see docs/DEPENDENCIES.md).
catalog:
  '@types/node': ^24.13.4
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitest/coverage-v8': ^4.1.11
  react: ^19.3.0
  react-dom: ^19.3.0
  socket.io: ^4.8.3
  socket.io-client: ^4.8.3
  tsx: ^4.23.13
  typescript: ~6.0.3
  vite: ^8.3.0
  vitest: ^4.1.11
  zod: ^4.6.5
