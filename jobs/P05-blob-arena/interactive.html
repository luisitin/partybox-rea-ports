<!doctype html>
<html lang="en" data-surface="phone">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blob Arena controller preview</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      body {
        background: var(--pb-bg);
        color: var(--pb-text);
        font-family: var(--pb-font-family);
      }
      #preview-header {
        display: flex;
        align-items: center;
        height: calc(var(--pb-space-8) + var(--pb-space-4));
        padding: 0 var(--pb-space-5);
        border-bottom: calc(var(--pb-space-1) / 4) solid var(--pb-surface-2);
        font-size: var(--pb-font-body);
        font-weight: 900;
      }
      #root {
        display: flex;
        flex-direction: column;
        height: calc(100dvh - var(--pb-space-8) - var(--pb-space-4));
        min-height: 0;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <header id="preview-header">PB · PREVIEW</header>
    <main id="root" data-ready="false"></main>
    <script type="module" src="./interactive.tsx"></script>
  </body>
</html>
