          </p>
          <div class="Controllermodulecss_controls">

              class="Controllermodulecss_pad"
              data-pad-primary="true"
              data-floating-joystick="true"
              aria-label="Steering pad. Drag or use arrow keys or W A S D."
            >
              <span class="Controllermodulecss_padLabel">Drag to steer</span>
            </button>
            <div class="Controllermodulecss_splitArea">
              <button
                type="button"
                class="Controllermodulecss_split"
                disabled=""
                aria-label="Split"
                aria-describedby="blob-split-reason"
              >
                <svg
                  viewBox="0 0 48 48"
                  aria-hidden="true"
                  focusable="false"
                  data-split-glyph="true"
                >
                  <circle cx="11" cy="24" r="8"></circle>
                  <path d="M24 8V40"></path>
                  <circle cx="37" cy="24" r="8"></circle></svg
                ><span>SPLIT</span>
              </button>
              <p id="blob-split-reason" class="Controllermodulecss_reason" aria-live="polite">
                Split cooling down
              </p>
              <p class="Controllermodulecss_risk">
                Hold steer + tap. Smaller halves are vulnerable.
              </p>
            </div>
          </div>
          <p class="Controllermodulecss_footer">Your name on the TV. Buzzer mass scores.</p>
        </div>
      </div>
    </main>
