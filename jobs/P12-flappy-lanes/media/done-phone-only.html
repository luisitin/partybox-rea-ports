<!doctype html>
<html lang="en" data-surface="controller" data-motion="off">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  /><title>Flappy Lanes · done · phone-only</title
  ><style>
    /* Design tokens (docs/DESIGN_SYSTEM.md). Every colour, size and duration in the app comes from here.
   Colour tokens are re-declared per theme below (docs/DESIGN_SYSTEM.md → Themes).
   The TV shell and the controller shell each set a type-scale column via `data-surface` (stamped on
   <html> by main.tsx and on the shell element). */
    :root {
      --pb-bg: #0f1020;
      /* ADR-056: how much of the page colour washes over a game's art — the backdrop behind play and
     the key art behind the start stage. Art is drawn for a dark stage; a light theme washes it
     far more, so text drawn on the stage keeps its contrast. */
      --pb-art-wash: 16%;
      --pb-tile-wash: 0%;
      --pb-surface: #1c1e3a;
      --pb-surface-2: #272a52;
      --pb-text: #f5f6ff;
      --pb-text-muted: #b3b7d9;
      --pb-accent: #ff5d8f;
      --pb-accent-2: #ffd166;
      --pb-accent-3: #06d6a0;
      --pb-danger: #ef476f;
      --pb-info: #4cc9f0;
      --pb-focus: #ffd166;
      --pb-on-accent: #1a0b12;
      /* accent-2 as a FILL (VIP pill, letter discs) — stays gold even where accent-2 text darkens */
      --pb-accent-2-fill: #ffd166;
      --pb-on-accent-2-fill: #1a0b12;
      /* optional edge for surfaces; only High Contrast sets it */
      --pb-border: transparent;
      /* the veil behind a pause curtain or a phone sheet: the theme's own ink, never a baked-in night */
      --pb-scrim: rgb(15 16 32 / 62%);

      --pb-player-1: #ff5d8f;
      --pb-player-2: #ffd166;
      --pb-player-3: #06d6a0;
      --pb-player-4: #4cc9f0;
      --pb-player-5: #b388ff;
      --pb-player-6: #ff9f43;
      --pb-player-7: #48dbfb;
      --pb-player-8: #f368e0;

      /* The two teams (P00 §6 TeamBanner, audit #52): Sun follows the theme's accent, Moon its info
     colour. Always shown with the shape (▲ / ●) and the name, never as a tint on a face. */
      --pb-team-sun: var(--pb-accent);
      --pb-team-moon: var(--pb-info);

      --pb-font-family:
        'Nunito Variable', 'Segoe UI Variable Display', 'Segoe UI', system-ui, -apple-system,
        Roboto, 'Helvetica Neue', Arial, sans-serif;
      --pb-font-mono: ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace;

      --pb-space-1: 4px;
      --pb-space-2: 8px;
      --pb-space-3: 12px;
      --pb-space-4: 16px;
      --pb-space-5: 24px;
      --pb-space-6: 32px;
      --pb-space-7: 48px;
      --pb-space-8: 64px;

      --pb-radius: 12px;
      --pb-radius-lg: 24px;
      --pb-touch: 44px;

      --pb-motion-fast: 150ms;
      --pb-motion-base: 300ms;
      --pb-motion-slow: 600ms;
      --pb-motion-pulse: 1000ms;
      --pb-motion-confetti: 3000ms;
      --pb-ease: cubic-bezier(0.2, 0.8, 0.2, 1);

      /* phone column by default; the TV shell overrides. I-100 C: rem, so a phone's "larger text"
     setting scales the words (16 px root = the same sizes as before). */
      --pb-font-display: 3rem;
      --pb-font-h1: 1.75rem;
      --pb-font-h2: 1.375rem;
      --pb-font-body: 1.125rem;
      --pb-font-caption: 0.875rem;
      --pb-font-button: 1.25rem;
      --pb-chip-size: 40px;
    }

    /* ── Themes (src/theme.ts sets data-theme on <html>; 
ight is the :root default above) ────────
   Every palette keeps text ≥ 4.5:1 on bg/surface and button labels ≥ 4.5:1 on accents. Player
   colours stay bright in every theme — they are avatar discs, not text. */
    [data-theme='daylight'] {
      color-scheme: light;
      --pb-bg: #f6f5ff;
      --pb-art-wash: 90%;
      --pb-tile-wash: 45%;
      --pb-surface: #ffffff;
      --pb-surface-2: #e9e7fb;
      --pb-text: #171633;
      --pb-text-muted: #4a4c6e;
      --pb-accent: #c2185b;
      --pb-accent-2: #7a4b00;
      --pb-accent-3: #0b6b4e;
      --pb-danger: #c0143c;
      --pb-info: #0b6e99;
      --pb-focus: #c2185b;
      --pb-on-accent: #ffffff;
      --pb-accent-2-fill: #ffd166;
      --pb-on-accent-2-fill: #1a0b12;
      --pb-scrim: rgb(23 22 51 / 45%);
    }

    [data-theme='arcade'] {
      --pb-bg: #050014;
      --pb-surface: #14002e;
      --pb-surface-2: #23064a;
      --pb-text: #f0f6ff;
      --pb-text-muted: #a8b3d6;
      --pb-accent: #ff2bd6;
      --pb-accent-2: #00f0ff;
      --pb-accent-3: #39ff14;
      --pb-danger: #ff3860;
      --pb-info: #8f96ff;
      --pb-focus: #00f0ff;
      --pb-on-accent: #050014;
      --pb-accent-2-fill: #00f0ff;
      --pb-on-accent-2-fill: #050014;
      --pb-scrim: rgb(5 0 20 / 62%);
    }

    [data-theme='cabin'] {
      --pb-bg: #1d1410;
      --pb-surface: #2c211b;
      --pb-surface-2: #3d2e26;
      --pb-text: #fbf3e8;
      --pb-text-muted: #cbb8a6;
      --pb-accent: #ee8050;
      --pb-accent-2: #f2c14e;
      --pb-accent-3: #8fbf5a;
      --pb-danger: #f07070;
      --pb-info: #6fb3d2;
      --pb-focus: #f2c14e;
      --pb-on-accent: #1d1410;
      --pb-accent-2-fill: #f2c14e;
      --pb-on-accent-2-fill: #1d1410;
      --pb-scrim: rgb(29 20 16 / 62%);
    }

    [data-theme='contrast'] {
      --pb-bg: #000000;
      --pb-surface: #111111;
      --pb-surface-2: #242424;
      --pb-text: #ffffff;
      --pb-text-muted: #e6e6e6;
      --pb-accent: #ff4fa3;
      --pb-accent-2: #ffff00;
      --pb-accent-3: #00ff88;
      --pb-danger: #ff5555;
      --pb-info: #66ccff;
      --pb-focus: #ffffff;
      --pb-on-accent: #000000;
      --pb-accent-2-fill: #ffff00;
      --pb-on-accent-2-fill: #000000;
      --pb-border: #ffffff;
      --pb-scrim: rgb(0 0 0 / 78%);
    }
    [data-surface='tv'] {
      --pb-font-display: 128px;
      --pb-font-h1: 72px;
      --pb-font-h2: 48px;
      --pb-font-body: 36px;
      --pb-font-caption: 28px;
      --pb-tv-text-min: 28px; /* nothing read from the couch is smaller (T-0393) */
      --pb-font-button: 36px;
      --pb-chip-size: 72px;
      /* 5 % of 1920×1080 in px: viewport units ignore the fit zoom (src/tv/fit.ts). */
      --pb-overscan-x: 96px;
      --pb-overscan-y: 54px;
    }

    @media (prefers-reduced-motion: reduce) {
      :root {
        --pb-motion-fast: 0ms;
        --pb-motion-base: 0ms;
        --pb-motion-slow: 0ms;
        --pb-motion-pulse: 0ms;
        --pb-motion-confetti: 0ms;
      }
    }

    /* The in-app motion switch (a phone's card-style sheet, loop 311): the same collapse. */
    :root[data-motion='off'] {
      --pb-motion-fast: 0ms;
      --pb-motion-base: 0ms;
      --pb-motion-slow: 0ms;
      --pb-motion-pulse: 0ms;
      --pb-motion-confetti: 0ms;
    }

    /* The face's `size` as CSS, at no specificity: a caller's class or `.Avatar_module_css_x svg` rule still sizes it,
   as it did over the old width/height attributes, which can't hold a CSS var (WebKit logged an
   error for every face, T-0174). */
    :where(.Avatar_module_css_avatar) {
      width: var(--pb-avatar-size);
      height: var(--pb-avatar-size);
    }

    /* I-268: "1st" in a thin ring of its own colour — size and colour come from the caller. */
    .LeadMark_module_css_lead {
      flex-shrink: 0;
      display: inline-block;
      padding: 0 0.45em;
      border: 0.12em solid currentColor;
      border-radius: 999px;
      font-weight: 900;
      line-height: 1.3;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .PlayerChip_module_css_chip {
      border: 1px solid var(--pb-border);
      display: inline-flex;
      align-items: center;
      gap: var(--pb-space-2);
      padding: var(--pb-space-1) var(--pb-space-3) var(--pb-space-1) var(--pb-space-1);
      border-radius: 999px;
      background: var(--pb-surface);
      max-width: 100%;
      transition:
        opacity var(--pb-motion-fast) var(--pb-ease),
        transform var(--pb-motion-fast) var(--pb-ease);
    }

    .PlayerChip_module_css_sm {
      --pb-chip-size: max(28px, calc(var(--pb-font-caption) * 1.45));
      font-size: var(--pb-font-caption);
    }

    .PlayerChip_module_css_md {
      font-size: var(--pb-font-body);
    }

    .PlayerChip_module_css_lg {
      --pb-chip-size: calc(var(--pb-font-h2) * 1.6);
      font-size: var(--pb-font-h2);
      padding-right: var(--pb-space-4);
    }

    .PlayerChip_module_css_avatar {
      position: relative;
      display: inline-flex;
    }

    .PlayerChip_module_css_you {
      flex-shrink: 0;
      padding: 0 0.45em;
      border-radius: 999px;
      background: var(--pb-surface-2);
      color: var(--pb-text-muted);
      font-size: 0.7em;
      font-weight: 800;
      line-height: 1.6;
    }

    .PlayerChip_module_css_bot {
      flex-shrink: 0;
      padding: 0 0.35em;
      border-radius: 999px;
      background: var(--pb-surface-2);
      font-size: 0.75em;
      line-height: 1.5;
    }

    /* ✕ to remove (bots you own): a full 44 px target that does not enlarge the chip visually. */
    .PlayerChip_module_css_remove {
      flex-shrink: 0;
      width: var(--pb-touch);
      height: var(--pb-touch);
      margin: calc(-1 * var(--pb-space-2)) calc(-1 * var(--pb-space-2)) calc(-1 * var(--pb-space-2))
        0;
      border-radius: 50%;
      color: var(--pb-text-muted);
      font-size: 1em;
      font-weight: 900;
    }

    .PlayerChip_module_css_remove:hover,
    .PlayerChip_module_css_remove:focus-visible {
      color: var(--pb-danger);
    }

    /* Readable from the couch (the old 0.7em star over the avatar was 12–20 px on the TV strip). */
    /* A badge that just moved here pops (a handover), a badge that was always here does not. */
    .PlayerChip_module_css_vipPop {
      animation: global(pb-pop) var(--pb-motion-slow) var(--pb-ease) both;
    }

    .PlayerChip_module_css_vip {
      flex-shrink: 0;
      padding: 0 0.45em;
      border-radius: 999px;
      background: var(--pb-accent-2-fill);
      color: var(--pb-on-accent-2-fill);
      font-size: 0.7em;
      font-weight: 900;
      line-height: 1.6;
      letter-spacing: 0.02em;
    }

    .PlayerChip_module_css_name {
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
      /* A name of sixteen wide glyphs made a 640 px chip and wrapped a four-player strip under the
     timer (pass 882): past 9 em the name ellipsizes — "Bartholomew XVII" still fits whole. */
      max-width: 9em;
    }

    /* faces only (the TV strip past two rows, a claim): no empty name slot, so the chips close up */
    /* A bot's owner part ellipsizes; its "bot 2" tail stays (reviewer 90838c). The person cap (9 em)
   plus room for the tail, so "Maximiliano's bot 2" is whole where the row has room and only the
   owner part gives way where it hasn't (reviewer 277967). */
    .PlayerChip_module_css_split {
      display: inline-flex;
      min-width: 0;
      max-width: 13em;
    }
    .PlayerChip_module_css_nameHead {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    /* The lobby's removable chip (T-0025): the owner's first name, or, in a cell too narrow for it (a
   320 px phone's two columns, `pb-chip-cell` in Lobby.PlayerChip_module_css_module.PlayerChip_module_css_css), the owner's initial alone. The
   tail never gives way. */
    .PlayerChip_module_css_nameInitial {
      display: none;
      flex-shrink: 0;
    }
    @container pb-chip-cell (max-width: 150px) {
      .PlayerChip_module_css_nameFirst {
        display: none;
      }
      .PlayerChip_module_css_nameInitial {
        display: inline;
      }
    }
    .PlayerChip_module_css_nameTail {
      flex-shrink: 0;
      margin-left: 0.25em;
      white-space: nowrap;
    }

    .PlayerChip_module_css_name:empty {
      display: none;
    }

    /* A fixed slot: empty and invisible until there is a glyph, then it scales in (no layout shift). */
    .PlayerChip_module_css_glyph {
      display: inline-grid;
      place-items: center;
      width: 1.3em;
      min-width: 1.3em;
      height: 1.3em;
      line-height: 1;
      font-weight: 800;
      color: var(--pb-text-muted);
      opacity: 0;
      transform: scale(0.6);
      transform-origin: 50% 50%;
      transition:
        opacity var(--pb-motion-fast) var(--pb-ease),
        transform var(--pb-motion-fast) var(--pb-ease);
    }

    .PlayerChip_module_css_glyph.PlayerChip_module_css_shown {
      opacity: 1;
      transform: none;
    }

    /* Locked in: a solid success disc that pops, plus an inner ring on the whole pill (box-shadow,
   not outline, so it coexists with .PlayerChip_module_css_active's outline when a game passes activeIds). */
    .PlayerChip_module_css_ok {
      border-radius: 50%;
      background: var(--pb-accent-3);
      color: var(--pb-on-accent);
      font-size: 1em;
      animation: global(pb-pop) var(--pb-motion-base) var(--pb-ease) both;
    }

    .PlayerChip_module_css_locked {
      box-shadow: inset 0 0 0 2px var(--pb-accent-3);
    }

    /* Reconnecting: the ⟳ actually turns (pb-spin is defined only under no-preference). */
    .PlayerChip_module_css_spin {
      animation: global(pb-spin) 2s linear infinite;
    }

    /* Running total (R-068): keyed on the value, so a change pops in place ("value changed"). */
    .PlayerChip_module_css_score {
      margin-left: var(--pb-space-2);
      font-variant-numeric: tabular-nums;
      font-weight: 800;
      color: var(--pb-accent-2);
      animation: global(pb-pop) var(--pb-motion-base) var(--pb-ease) both;
    }

    .PlayerChip_module_css_leader {
      margin-left: var(--pb-space-2);
      font-size: 0.62em;
      color: var(--pb-accent-2);
    }

    /* Held-over number while the game withholds the strip: quiet, and it must not pop again. */
    .PlayerChip_module_css_scoreMuted {
      color: var(--pb-text-muted);
      animation: none;
    }

    .PlayerChip_module_css_leader + .PlayerChip_module_css_score {
      margin-left: var(--pb-space-1);
    }

    /* the ghost's gold total at 0.75 read 4.1:1 on daylight (T-0224): an away total is plain text */
    .PlayerChip_module_css_off .PlayerChip_module_css_score {
      color: var(--pb-text);
    }

    .PlayerChip_module_css_active {
      outline: 3px solid var(--pb-accent-2);
      transform: scale(1.04);
    }

    /* ── I-009 A: the link drops — the chip flickers out (opacity steps over --pb-motion-slow) and
   sits as a ghost at 0.75 (its name in full text colour: muted under 0.6 read 2.8:1, T-0224); the
   link returns — the chip pops back with a green ring that fades over
   a second. Opacity + transform + outline-colour only; both collapse under reduced motion. The
   ring skips an .PlayerChip_module_css_active chip (its gold outline is the judge's mark and must survive the fade). */
    .PlayerChip_module_css_off {
      opacity: 0.75;
    }
    .PlayerChip_module_css_flicker {
      animation: pb-signal-lost var(--pb-motion-slow) steps(1, end) both;
    }
    @keyframes pb-signal-lost {
      0% {
        opacity: 1;
      }
      15% {
        opacity: 0.2;
      }
      30% {
        opacity: 0.9;
      }
      45% {
        opacity: 0.15;
      }
      60% {
        opacity: 0.7;
      }
      75% {
        opacity: 0.25;
      }
      100% {
        opacity: 0.75;
      }
    }
    .PlayerChip_module_css_snap {
      animation: global(pb-pop) var(--pb-motion-base) var(--pb-ease) both;
    }
    .PlayerChip_module_css_snap:not(.PlayerChip_module_css_active) {
      outline: 3px solid transparent;
      animation:
        global(pb-pop) var(--pb-motion-base) var(--pb-ease) both,
        pb-back-ring var(--pb-motion-pulse) ease-out both;
    }
    @keyframes pb-back-ring {
      from {
        outline-color: var(--pb-accent-3);
      }
      to {
        outline-color: transparent;
      }
    }

    .PlayerChip_module_css_spectator {
      opacity: 0.6;
    }

    /* ── I-045 B + the owner's note: the thinking dots OVER the avatar — the portrait dims to 0.35
   under three gold dots pulsing in turn (opacity only, 1.2 s); the twins hold them steady. */
    .PlayerChip_module_css_portrait {
      display: inline-flex;
    }
    .PlayerChip_module_css_avatarThinking > .PlayerChip_module_css_portrait {
      opacity: 0.35;
    }
    .PlayerChip_module_css_dots {
      position: absolute;
      inset: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
    }
    .PlayerChip_module_css_dots > i {
      width: 22%;
      height: 22%;
      border-radius: 50%;
      background: var(--pb-accent-2);
      animation: pb-think 1200ms ease-in-out infinite;
    }
    .PlayerChip_module_css_dots > i:nth-child(2) {
      animation-delay: 200ms;
    }
    .PlayerChip_module_css_dots > i:nth-child(3) {
      animation-delay: 400ms;
    }
    @keyframes pb-think {
      0%,
      100% {
        opacity: 0.25;
      }
      50% {
        opacity: 1;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .PlayerChip_module_css_dots > i {
        animation: none;
        opacity: 0.8;
      }
    }
    :root[data-motion='off'] .PlayerChip_module_css_dots > i {
      animation: none;
      opacity: 0.8;
    }

    /* ── I-070 C: a wave — ±12° twice over 500 ms (transform only), on the nudger's chip. */
    .PlayerChip_module_css_wave {
      animation: pb-wave-chip 500ms var(--pb-ease) 2;
      transform-origin: 50% 90%;
    }
    @keyframes pb-wave-chip {
      0%,
      100% {
        transform: rotate(0);
      }
      25% {
        transform: rotate(-12deg);
      }
      75% {
        transform: rotate(12deg);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .PlayerChip_module_css_wave {
        animation: none;
      }
    }
    :root[data-motion='off'] .PlayerChip_module_css_wave {
      animation: none;
    }

    /* ── I-089 A: the grace left, small, after the name of a dropped player. */
    .PlayerChip_module_css_away {
      flex-shrink: 0;
      font-size: 0.7em;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: var(--pb-text-muted);
    }

    /* ── I-089 B: a thin ring drains around the dimmed face (one CSS var, repainted per second). */
    .PlayerChip_module_css_draining {
      position: relative;
      border-radius: 50%;
    }
    .PlayerChip_module_css_draining::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: conic-gradient(var(--pb-text-muted) var(--pb-away, 360deg), transparent 0);
      -webkit-mask: radial-gradient(
        farthest-side,
        transparent calc(100% - 3px),
        currentColor calc(100% - 2px)
      );
      mask: radial-gradient(
        farthest-side,
        transparent calc(100% - 3px),
        currentColor calc(100% - 2px)
      );
      pointer-events: none;
    }

    /* ── I-268 C: "+N" rises over a score that just went up, and fades (2 s, the component's timer). */
    .PlayerChip_module_css_scoreBox {
      position: relative;
      display: inline-flex;
    }
    .PlayerChip_module_css_leader + .PlayerChip_module_css_scoreBox > .PlayerChip_module_css_score {
      margin-left: var(--pb-space-1);
    }
    .PlayerChip_module_css_rise {
      position: absolute;
      left: 50%;
      bottom: 78%;
      font-size: 0.7em;
      font-weight: 900;
      line-height: 1;
      color: var(--pb-accent-2);
      white-space: nowrap;
      pointer-events: none;
      text-shadow: 0 1px 2px var(--pb-scrim);
      animation: rise 2s var(--pb-ease) both;
    }
    @keyframes rise {
      0% {
        opacity: 0;
        transform: translate(-50%, 0.4em);
      }
      15% {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      80% {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -0.3em);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .PlayerChip_module_css_rise {
        animation: none;
        transform: translateX(-50%);
      }
    }

    /* Materials R2: source adaptations and new relief paint are recorded in SOURCES.PlayerChip_module_css_md. */
    .PlayerChip_module_css_chip {
      background:
        linear-gradient(
          180deg,
          color-mix(in srgb, var(--pb-text) 12%, transparent),
          transparent 7px
        ),
        linear-gradient(
            90deg,
            color-mix(in srgb, var(--pb-text) 2%, transparent) 50%,
            transparent 50%
          )
          0 0 / 3px 3px,
        linear-gradient(0deg, color-mix(in srgb, var(--pb-bg) 35%, transparent), transparent 55%),
        var(--pb-surface);
      border-color: color-mix(in srgb, var(--pb-border) 70%, var(--pb-surface-2));
    }
    :root[data-theme='contrast'] .PlayerChip_module_css_chip {
      background: var(--pb-surface);
      border-color: var(--pb-border);
    }

    .Scoreboard_module_css_board {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: var(--pb-space-2);
      width: 100%;
      max-width: 28em;
    }

    /* 5-6 rows under a heading: body-size rows (~60 px) so six fit in ≈ 400 px. */
    .Scoreboard_module_css_tight .Scoreboard_module_css_row,
    .Scoreboard_module_css_tight3 .Scoreboard_module_css_row,
    .Scoreboard_module_css_tight4 .Scoreboard_module_css_row {
      font-size: var(--pb-font-body);
      --pb-row-py: var(--pb-space-1);
      padding: var(--pb-row-py) var(--pb-space-3);
      --pb-chip-size: 1.3em;
    }

    .Scoreboard_module_css_dense {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--pb-space-2) var(--pb-space-4);
      max-width: none;
    }

    .Scoreboard_module_css_dense .Scoreboard_module_css_row {
      /* h2 digits still read from the couch (7-12 rows); 12 rows in two columns ≈ 470 px */
      --pb-row-py: var(--pb-space-1);
      padding: var(--pb-row-py) var(--pb-space-3);
      --pb-chip-size: 1.3em;
    }

    /* 13+ rows: three body-size columns (16 players = 6 rows ≈ 400 px). */
    .Scoreboard_module_css_tight3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--pb-space-2) var(--pb-space-4);
      max-width: none;
    }

    /* Four columns on request (`columns={4}`): 16 rows in four ≈ 270 px, for a board under a four-row
   roster. ~420 px cells, so the gaps tighten like the three-column rows. */
    .Scoreboard_module_css_tight4 {
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: var(--pb-space-2) var(--pb-space-3);
      max-width: none;
    }

    /* Small: body-size rows for a dense board that shares the stage with a tall header. */
    .Scoreboard_module_css_sm .Scoreboard_module_css_row {
      font-size: var(--pb-font-body);
      --pb-row-py: var(--pb-space-1);
      padding: var(--pb-row-py) var(--pb-space-3);
      --pb-chip-size: 1.3em;
    }

    /* Large: the board owns the stage (results, 7–8 players in two columns of ≤ 4). 1.1× h2 with
   roomier padding — h1 rows spilled their scores out of a 3/5-width column (review-loop #32). */
    .Scoreboard_module_css_lg .Scoreboard_module_css_row {
      font-size: calc(var(--pb-font-h2) * 1.1);
      --pb-row-py: var(--pb-space-3);
      padding: var(--pb-row-py) var(--pb-space-4);
      --pb-chip-size: 1.4em;
    }

    .Scoreboard_module_css_lg .Scoreboard_module_css_name {
      min-width: 4ch;
    }

    .Scoreboard_module_css_lg {
      gap: var(--pb-space-3) var(--pb-space-5);
    }

    /* Column-major: ranks read down the left column, then the next (--pb-board-rows is set inline). */
    .Scoreboard_module_css_dense,
    .Scoreboard_module_css_tight3,
    .Scoreboard_module_css_tight4 {
      grid-auto-flow: column;
      grid-template-rows: repeat(var(--pb-board-rows, 1), auto);
    }

    .Scoreboard_module_css_row {
      display: grid;
      grid-template-columns: 1.6em auto 1fr auto auto;
      align-items: center;
      gap: var(--pb-space-3);
      --pb-row-py: var(--pb-space-2);
      padding: var(--pb-row-py) var(--pb-space-4);
      border-radius: var(--pb-radius);
      border: 1px solid var(--pb-border);
      background: var(--pb-surface);
      font-size: var(--pb-font-h2);
      font-weight: 700;
    }

    .Scoreboard_module_css_compact .Scoreboard_module_css_row {
      font-size: var(--pb-font-body);
      --pb-row-py: var(--pb-space-2);
      padding: var(--pb-row-py) var(--pb-space-3);
      gap: var(--pb-space-2);
    }

    /* The phone board is measured in its rows' own text size, so 200 % text (≈ 10 em across a phone)
   is told apart from an SE at 100 % (≈ 16 em): there the rank column, gaps and padding give their
   room to the name, so "Maximiliano" fits whole (session-c ec3ea7). */
    .Scoreboard_module_css_compact {
      container-type: inline-size;
      width: 100%;
      font-size: var(--pb-font-body);
    }

    @container (max-width: 12em) {
      .Scoreboard_module_css_compact .Scoreboard_module_css_row {
        grid-template-columns: 1.05em auto 1fr auto auto;
        gap: var(--pb-space-1);
        padding-inline: var(--pb-space-1) var(--pb-space-2);
      }

      /* a row with no delta or wager mark drops that empty track and its gap: "Maximiliano" beside a
     4-digit score needed 203 px against 197 (session-c 42aaee) */
      .Scoreboard_module_css_compact
        .Scoreboard_module_css_row:not(
          :has(> .Scoreboard_module_css_delta, > .Scoreboard_module_css_mark)
        ) {
        grid-template-columns: 1.05em auto 1fr auto;
      }

      .Scoreboard_module_css_compact .Scoreboard_module_css_score {
        font-size: 0.88em;
      }
    }

    /* On a phone the delta and the score take the row's end: a name wraps to a second line instead of
   losing its end to an ellipsis ("Tess's bo…", fake-out's SE play-test), at its spaces only; a word
   wider than the row ends in its own ellipsis ("Maximili…" over "Guadalupe" at 200 %, session-c
   ec3ea7: never broken mid-word). */
    .Scoreboard_module_css_compact .Scoreboard_module_css_name {
      white-space: normal;
      line-height: 1.15;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .Scoreboard_module_css_compact .Scoreboard_module_css_word {
      display: inline-block;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      vertical-align: top;
    }

    .Scoreboard_module_css_top {
      background: var(--pb-surface-2);
      outline: 3px solid var(--pb-accent-2);
    }

    .Scoreboard_module_css_me {
      /* --pb-me: a team's card sets its own colour, so "you" never reads as the other team (Sun is the
     accent pink: tune-in 243619) */
      box-shadow: inset 4px 0 0 var(--pb-me, var(--pb-accent));
    }

    /* Phone (compact) only: my row pops in and, when not the winner's outlined row, gets its own
   accent ring so "that one is me" reads at a glance. The ring is an inset shadow with the left bar
   folded in: an outline drew outside the row (clipped by the scroller, doubled beside the bar and
   the neighbours' edges: T-0282). */
    .Scoreboard_module_css_compact .Scoreboard_module_css_me:not(.Scoreboard_module_css_top) {
      box-shadow:
        inset 0 0 0 2px var(--pb-me, var(--pb-accent)),
        inset 4px 0 0 var(--pb-me, var(--pb-accent));
    }

    .Scoreboard_module_css_compact .Scoreboard_module_css_me {
      animation: global(pb-pop) var(--pb-motion-base) var(--pb-ease) both;
    }

    .Scoreboard_module_css_rank {
      text-align: center;
      color: var(--pb-text-muted);
      font-variant-numeric: tabular-nums;
    }

    /* T-0257: a row's tags on their own line under the name (a hidden role, a power used). */
    .Scoreboard_module_css_tags {
      display: block;
      font-size: 0.72em;
      color: var(--pb-text-muted);
      white-space: normal;
    }

    .Scoreboard_module_css_name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      /* a centred Stage must not centre the names */
      text-align: left;
    }

    /* Names keep a floor so they do not vanish, but never so much that the score column is pushed out
   of the cell (9ch clipped a 4-digit winner's score in the results' 3/5-width board). */
    .Scoreboard_module_css_dense .Scoreboard_module_css_name {
      min-width: 5ch;
    }

    /* Three columns in a narrow results board leave ~100 px for the name: tighter rank + gaps. */
    .Scoreboard_module_css_tight3 .Scoreboard_module_css_row,
    .Scoreboard_module_css_tight4 .Scoreboard_module_css_row {
      grid-template-columns: 1.2em auto 1fr auto auto;
      gap: var(--pb-space-2);
    }

    .Scoreboard_module_css_delta {
      color: var(--pb-accent-3);
      font-size: 0.8em;
    }
    .Scoreboard_module_css_loss {
      /* a touch toward the text colour: the night danger red was 4.4:1 on the row (T-0236) */
      color: color-mix(in srgb, var(--pb-danger) 88%, var(--pb-text));
    }

    /* A ✓ in the delta slot (markIds): this row has acted, e.Scoreboard_module_css_g. its wager is placed. */
    .Scoreboard_module_css_mark {
      color: var(--pb-accent-3);
      font-weight: 900;
    }

    .Scoreboard_module_css_score {
      font-variant-numeric: tabular-nums;
      color: var(--pb-accent-2);
      font-weight: 900;
      /* T-0175: always the last column, so a row with no delta or ✓ ends where the others do (it
     sat one gap short of the edge) */
      grid-column: -2;
    }

    /* Entrance (R-056): rows rise one per --pb-stagger-step in --pb-i order; each delta lands a beat
   after its row; the leader's trophy pops as its row settles (on `down`, the results screen, that
   is first: T-0230). Tokens only, so reduced motion = instant. */
    .Scoreboard_module_css_staggered {
      --pb-stagger-step: var(--pb-motion-fast);
    }

    .Scoreboard_module_css_staggered.Scoreboard_module_css_dense,
    .Scoreboard_module_css_staggered.Scoreboard_module_css_tight3,
    .Scoreboard_module_css_staggered.Scoreboard_module_css_tight4,
    .Scoreboard_module_css_staggered.Scoreboard_module_css_down {
      --pb-stagger-step: calc(var(--pb-motion-fast) / 2);
    }

    .Scoreboard_module_css_staggered .Scoreboard_module_css_row {
      animation: global(pb-rise) var(--pb-motion-base) var(--pb-ease) both;
      animation-delay: calc(var(--pb-i, 0) * var(--pb-stagger-step));
    }

    .Scoreboard_module_css_staggered .Scoreboard_module_css_delta {
      animation: global(pb-rise) var(--pb-motion-base) var(--pb-ease) both;
      animation-delay: calc(var(--pb-i, 0) * var(--pb-stagger-step) + var(--pb-motion-base));
    }

    .Scoreboard_module_css_staggered .Scoreboard_module_css_top .Scoreboard_module_css_rank {
      display: inline-block;
      animation: global(pb-pop) var(--pb-motion-base) var(--pb-ease) both;
      animation-delay: calc(
        var(--pb-i, 0) * var(--pb-stagger-step) + var(--pb-motion-base) + var(--pb-motion-slow)
      );
    }

    /* On `down` the winner lands first (T-0230), so its trophy pops as that row settles, not a slow
   beat later (the review: 0.6 s of a winner row without its trophy). */
    .Scoreboard_module_css_staggered.Scoreboard_module_css_down
      .Scoreboard_module_css_top
      .Scoreboard_module_css_rank {
      animation-delay: calc(var(--pb-i, 0) * var(--pb-stagger-step) + var(--pb-motion-base));
    }

    /* ── I-027 A, T-0280: the climb (stagger="climb"). Rows fade in where they stood last round —
   --pb-from rows away (a row's own height plus the board gap per row) — the deltas land a beat
   later, the totals count from --pb-motion-base, and each mover slides to its new place over
   --pb-motion-slow, starting at its own --pb-start (Scoreboard.Scoreboard_module_css_tsx climbPlan: a fixed stagger, top
   place first). One move per row: translateY only, no scale, no fade, no lift shadow; the z-order
   is fixed for the whole climb (climbers over, holders mid, fallers under, set inline), so a row
   never flips in front of another mid-slide; a climber also shrinks toward its right edge while
   it passes, so the row it crosses keeps its rank, face and name in view (review of T-0280: with
   the climbers under, or unshrunk, whole rows vanished mid-slide). A mover's delta and glow land with its own row
   (--pb-land); a holder's delta lands at --pb-motion-base. Reduced motion drops every wait. */
    .Scoreboard_module_css_climb .Scoreboard_module_css_row {
      animation:
        global(pb-fade-in) var(--pb-motion-base) var(--pb-ease) both,
        pb-climb var(--pb-motion-slow) var(--pb-ease) var(--pb-start, 1200ms) both;
    }
    .Scoreboard_module_css_climb .Scoreboard_module_css_delta {
      animation: global(pb-rise) var(--pb-motion-base) var(--pb-ease)
        var(--pb-delta-at, var(--pb-motion-base)) both; /* prettier-ignore */
    }
    /* A lane cannot fix a full overlap (two neighbours swapping cross exactly), so the climber shrinks
   toward its right edge instead: it covers only the passed row's score end, baring its rank, face
   and name. It stays over; the right edge never moves. */
    .Scoreboard_module_css_climb .Scoreboard_module_css_rose {
      --pb-lift: 0.55;
      transform-origin: right center;
    }
    .Scoreboard_module_css_columns.Scoreboard_module_css_climb .Scoreboard_module_css_rose {
      --pb-lift: 0.5;
    }
    /* T-0301 (F18): a climber shrunk toward its right edge still covers the passed row's score end,
   and mid-slide it cuts that number through the glyphs. While the climbers are in their lane the
   fallers' totals sit back (a dim number, not half of one) and come home once the board settles. */
    .Scoreboard_module_css_climb .Scoreboard_module_css_fell .Scoreboard_module_css_score {
      animation: pb-score-dim var(--pb-lane-run, 0ms) ease-in-out 1100ms both;
    }
    @keyframes pb-score-dim {
      from,
      to {
        opacity: 1;
      }
      12%,
      84% {
        opacity: 0.12;
      }
    }
    @keyframes pb-lane {
      from,
      to {
        scale: 1;
      }
      /* the run is the whole climb / 0.8 (Scoreboard.Scoreboard_module_css_tsx), so the last row lands at 80 % and the
     shrink is held until 84 %: it only ramps out on a settled board */
      12%,
      84% {
        scale: var(--pb-lift, 1);
      }
    }
    @keyframes pb-climb {
      from {
        transform: translateY(calc(var(--pb-from, 0) * (100% + var(--pb-space-2))));
      }
      to {
        transform: none;
      }
    }

    /* ── I-027 B: movers glow once their row lands: a climbed row's outline is green and fades over
   1 s, a fallen row's a dim red; a row that held its place gets nothing. The glow fills forwards
   only (T-0280: with `both` it painted its first colour from 0 s, before the row had moved). The
   rank digit and the slide itself carry the story — the colour is never alone. */
    .Scoreboard_module_css_climb .Scoreboard_module_css_rose,
    .Scoreboard_module_css_climb .Scoreboard_module_css_fell {
      outline: 3px solid transparent;
      outline-offset: -1px;
    }
    .Scoreboard_module_css_climb .Scoreboard_module_css_rose {
      animation:
        global(pb-fade-in) var(--pb-motion-base) var(--pb-ease) both,
        pb-climb var(--pb-motion-slow) var(--pb-ease) var(--pb-start, 1200ms) both,
        pb-glow-up var(--pb-motion-pulse) ease-out var(--pb-land, 1800ms) forwards,
        pb-lane var(--pb-lane-run, var(--pb-motion-slow)) ease-in-out 1100ms both;
    }
    .Scoreboard_module_css_climb .Scoreboard_module_css_fell {
      animation:
        global(pb-fade-in) var(--pb-motion-base) var(--pb-ease) both,
        pb-climb var(--pb-motion-slow) var(--pb-ease) var(--pb-start, 1200ms) both,
        pb-glow-down var(--pb-motion-pulse) ease-out var(--pb-land, 1800ms) forwards;
    }
    /* The old rank gives way to the new one as its row lands. */
    .Scoreboard_module_css_swap {
      display: inline-block;
      animation: global(pb-pop) var(--pb-motion-base) var(--pb-ease) both;
    }
    /* T-0191: a row that changes column does not fly across the board. T-0262: it stays at its old
   place (--pb-col-from columns, --pb-from rows away; a column is its own width plus the column gap)
   until the slide, fades out there as the others move, and fades in at its new place: the board
   never shows a hole. `filter: opacity` keeps the mount fade (`opacity`) its own. */
    .Scoreboard_module_css_board {
      --pb-col-gap: var(--pb-space-2);
    }
    .Scoreboard_module_css_dense,
    .Scoreboard_module_css_tight3 {
      --pb-col-gap: var(--pb-space-4);
    }
    .Scoreboard_module_css_tight4 {
      --pb-col-gap: var(--pb-space-3);
    }
    .Scoreboard_module_css_lg {
      --pb-col-gap: var(--pb-space-5);
    }
    .Scoreboard_module_css_climb .Scoreboard_module_css_row.Scoreboard_module_css_hop {
      animation:
        global(pb-fade-in) var(--pb-motion-base) var(--pb-ease) both,
        pb-hop var(--pb-motion-slow) var(--pb-ease) var(--pb-start, 1200ms) both;
    }
    .Scoreboard_module_css_climb
      .Scoreboard_module_css_row.Scoreboard_module_css_hop.Scoreboard_module_css_rose {
      animation:
        global(pb-fade-in) var(--pb-motion-base) var(--pb-ease) both,
        pb-hop var(--pb-motion-slow) var(--pb-ease) var(--pb-start, 1200ms) both,
        pb-glow-up var(--pb-motion-pulse) ease-out var(--pb-land, 1800ms) forwards;
    }
    .Scoreboard_module_css_climb
      .Scoreboard_module_css_row.Scoreboard_module_css_hop.Scoreboard_module_css_fell {
      animation:
        global(pb-fade-in) var(--pb-motion-base) var(--pb-ease) both,
        pb-hop var(--pb-motion-slow) var(--pb-ease) var(--pb-start, 1200ms) both,
        pb-glow-down var(--pb-motion-pulse) ease-out var(--pb-land, 1800ms) forwards;
    }
    @keyframes pb-hop {
      from,
      45% {
        transform: translate(
          calc(var(--pb-col-from, 0) * (100% + var(--pb-col-gap))),
          calc(var(--pb-from, 0) * (100% + var(--pb-space-2)))
        );
      }
      from,
      25% {
        filter: opacity(1);
      }
      45%,
      46% {
        filter: opacity(0);
      }
      46%,
      to {
        transform: none;
      }
      66%,
      to {
        filter: opacity(1);
      }
    }
    @keyframes pb-glow-up {
      from {
        outline-color: var(--pb-accent-3);
      }
      to {
        outline-color: transparent;
      }
    }
    @keyframes pb-glow-down {
      from {
        outline-color: color-mix(in srgb, var(--pb-danger) 60%, transparent);
      }
      to {
        outline-color: transparent;
      }
    }

    /* The waits are literal (1200 / 1800 ms), so they collapse here — after the .Scoreboard_module_css_rose / .Scoreboard_module_css_fell rules,
   which restate the animation list (pass 865: movers still sat 1.2 s in the old order). */
    @media (prefers-reduced-motion: reduce) {
      .Scoreboard_module_css_climb {
        --pb-lane-run: 0ms !important; /* no lift held while the rows are already in place */
      }
      .Scoreboard_module_css_climb .Scoreboard_module_css_row,
      .Scoreboard_module_css_climb .Scoreboard_module_css_rose,
      .Scoreboard_module_css_climb .Scoreboard_module_css_fell,
      .Scoreboard_module_css_climb .Scoreboard_module_css_row.Scoreboard_module_css_hop,
      .Scoreboard_module_css_climb
        .Scoreboard_module_css_row.Scoreboard_module_css_hop.Scoreboard_module_css_rose,
      .Scoreboard_module_css_climb
        .Scoreboard_module_css_row.Scoreboard_module_css_hop.Scoreboard_module_css_fell,
      .Scoreboard_module_css_climb .Scoreboard_module_css_delta {
        animation-delay: 0ms;
      }
    }
    :root[data-motion='off'] .Scoreboard_module_css_climb {
      --pb-lane-run: 0ms !important;
    }
    :root[data-motion='off'] .Scoreboard_module_css_climb .Scoreboard_module_css_row,
    :root[data-motion='off'] .Scoreboard_module_css_climb .Scoreboard_module_css_rose,
    :root[data-motion='off'] .Scoreboard_module_css_climb .Scoreboard_module_css_fell,
    :root[data-motion='off']
      .Scoreboard_module_css_climb
      .Scoreboard_module_css_row.Scoreboard_module_css_hop,
    :root[data-motion='off']
      .Scoreboard_module_css_climb
      .Scoreboard_module_css_row.Scoreboard_module_css_hop.Scoreboard_module_css_rose,
    :root[data-motion='off']
      .Scoreboard_module_css_climb
      .Scoreboard_module_css_row.Scoreboard_module_css_hop.Scoreboard_module_css_fell,
    :root[data-motion='off'] .Scoreboard_module_css_climb .Scoreboard_module_css_delta {
      animation-delay: 0ms;
    }

    /* ── I-146 B: the band a split column covers, over its first row. */
    .Scoreboard_module_css_band {
      position: absolute;
      top: -1.35em;
      left: var(--pb-space-3);
      font-size: 0.62em;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: var(--pb-muted, rgba(255, 255, 255, 0.55));
    }
    .Scoreboard_module_css_board .Scoreboard_module_css_row {
      position: relative;
    }

    /* ── I-146 C, T-0181, T-0280: a tie is a tinted chip inside each tied row's own rank cell — two
   rows sharing a number. It replaced a pill that ran down through the row gaps (and a copy of the
   winner's ring above it): that slab painted past the rows and, mid-climb, sat where the rows no
   longer were. Now nothing is drawn outside a row. The winners' own tie is the trophies: no chip on
   a 🏆 row. */
    .Scoreboard_module_css_tied .Scoreboard_module_css_rank {
      display: grid;
      place-items: center;
      align-self: stretch;
      border-radius: 0.4em;
      color: var(--pb-text);
      background: color-mix(in srgb, var(--pb-accent) 34%, var(--pb-surface));
    }

    /* No ranks (a team's card, ADR-052): the rows drop the rank column along with its cell, so the
   name takes that room (~110 px at 200 % text; reviewer 69417f). After the tiers so it wins. */
    .Scoreboard_module_css_noRanks .Scoreboard_module_css_row,
    .Scoreboard_module_css_noRanks.Scoreboard_module_css_tight3 .Scoreboard_module_css_row,
    .Scoreboard_module_css_noRanks.Scoreboard_module_css_tight4 .Scoreboard_module_css_row {
      grid-template-columns: auto 1fr auto auto;
    }

    @container (max-width: 12em) {
      .Scoreboard_module_css_compact.Scoreboard_module_css_noRanks .Scoreboard_module_css_row {
        grid-template-columns: auto 1fr auto auto;
      }

      .Scoreboard_module_css_compact.Scoreboard_module_css_noRanks
        .Scoreboard_module_css_row:not(
          :has(> .Scoreboard_module_css_delta, > .Scoreboard_module_css_mark)
        ) {
        grid-template-columns: auto 1fr auto;
      }
    }

    /* A narrow phone (SE at 200 %) stacks the delta over its total: side by side with a 1-space gap
   "−25 75" read as "−2575" (T-0043 F2), and the stack gives the name the row's width back. */
    @container (max-width: 12em) {
      .Scoreboard_module_css_compact
        .Scoreboard_module_css_row:has(> .Scoreboard_module_css_delta) {
        grid-template-columns: 1.05em auto 1fr auto;
        row-gap: 0;
      }

      .Scoreboard_module_css_compact.Scoreboard_module_css_noRanks
        .Scoreboard_module_css_row:has(> .Scoreboard_module_css_delta) {
        grid-template-columns: auto 1fr auto;
      }

      .Scoreboard_module_css_compact
        .Scoreboard_module_css_row:has(> .Scoreboard_module_css_delta)
        > :not(
          .Scoreboard_module_css_delta,
          .Scoreboard_module_css_score,
          .Scoreboard_module_css_band
        ) {
        grid-row: 1 / span 2;
      }

      .Scoreboard_module_css_compact .Scoreboard_module_css_row > .Scoreboard_module_css_delta {
        grid-column: -2;
        grid-row: 1;
        justify-self: end;
        align-self: end;
        line-height: 1.1;
      }

      .Scoreboard_module_css_compact
        .Scoreboard_module_css_row:has(> .Scoreboard_module_css_delta)
        > .Scoreboard_module_css_score {
        grid-column: -2;
        grid-row: 2;
        justify-self: end;
        align-self: start;
        line-height: 1.1;
      }
    }

    .DeadlineBar_module_css_track {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: var(--pb-surface-2);
      overflow: hidden;
    }

    .DeadlineBar_module_css_fill {
      height: 100%;
      background: var(--pb-accent-2);
      transform-origin: left center;
      /* Literal 300 ms (>= the 250 ms clock tick) so each retarget starts before the last one ends and
     the drain is continuous; it stays literal under reduced motion because the drain is
     information, not decoration. */
      transition:
        transform 300ms linear,
        background-color var(--pb-motion-fast) var(--pb-ease);
    }

    .DeadlineBar_module_css_urgent .DeadlineBar_module_css_fill {
      background: var(--pb-danger);
    }

    .DeadlineBar_module_css_paused .DeadlineBar_module_css_fill {
      background: var(--pb-text-muted);
    }

    /* Fixed to the viewport: TallyFlights measures its own box against the boxes it flies between, so it
   holds on the zoomed 1920×1080 TV surface at any size. Transform + opacity only. */
    .Tally_module_css_overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 40;
    }

    .Tally_module_css_token {
      position: absolute;
      top: 0;
      left: 0;
      opacity: 0;
      will-change: transform, opacity;
    }

    .Tally_module_css_face {
      border-radius: 50%;
      filter: drop-shadow(0 6px 10px rgb(0 0 0 / 35%));
    }

    .Tally_module_css_face > svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .Tally_module_css_points {
      padding: 0.05em 0.5em;
      border-radius: 999px;
      background: var(--pb-fill, #ffd166);
      color: var(--pb-on-fill, #1a0b12);
      font-size: var(--pb-font-h2, 32px);
      font-weight: 900;
      line-height: 1.3;
      white-space: nowrap;
      box-shadow: 0 8px 18px rgb(0 0 0 / 30%);
    }

    /* A landing slot: empty until its face arrives, then it pops once under the landed token. */
    .Tally_module_css_wait {
      visibility: hidden;
    }

    .Tally_module_css_land {
      animation: tally-land calc(var(--pb-motion-base, 300ms) * 0.9) var(--pb-ease, ease-out);
    }

    @keyframes tally-land {
      0% {
        transform: scale(1.35);
      }

      60% {
        transform: scale(0.94);
      }

      100% {
        transform: scale(1);
      }
    }

    .Tally_module_css_tick {
      display: inline-block;
      animation: tally-tick var(--pb-motion-base, 300ms) var(--pb-ease, ease-out);
    }

    @keyframes tally-tick {
      0% {
        transform: scale(1.4);
      }

      100% {
        transform: scale(1);
      }
    }

    .Stage_module_css_stage {
      display: flex;
      flex-direction: column;
      gap: var(--pb-space-5);
      min-height: 100%;
      /* The top is the overscan band unless the host already fills it (T-0179: under the playing
     header, which sits inside the band, the shell sets --pb-stage-top). */
      padding: var(--pb-stage-top, var(--pb-overscan-y, 54px)) var(--pb-overscan-x, 96px)
        var(--pb-overscan-y, 54px);
    }

    .Stage_module_css_center {
      /* `safe`: a stage taller than its box overflows downward, never up under the roster (a 16-player
     Bingo with the hall board on put its kicker through the third chip row — loop 265). */
      justify-content: safe center;
      align-items: safe center;
      text-align: center;
    }

    .BigText_module_css_big {
      font-weight: 800;
      line-height: 1.15;
      text-wrap: balance;
      overflow-wrap: anywhere;
    }

    .BigText_module_css_display {
      font-size: var(--pb-font-display);
      font-weight: 900;
      line-height: 1;
    }

    .BigText_module_css_h1 {
      font-size: var(--pb-font-h1);
    }

    .BigText_module_css_h2 {
      font-size: var(--pb-font-h2);
    }

    .BigText_module_css_accent {
      color: var(--pb-accent-2);
    }

    .BigText_module_css_muted {
      color: var(--pb-text-muted);
    }

    .BigText_module_css_default {
      color: var(--pb-text);
    }

    .Timer_module_css_timer {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--pb-space-3);
      min-width: 2.2em;
      padding: 0 var(--pb-space-4);
      border-radius: var(--pb-radius-lg);
      background: var(--pb-surface);
      color: var(--pb-accent-2);
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
      /* Leaving urgency at a phase boundary eases over the base token: the fast one read as a snap
     next to the 300 ms phase rise (review-loop #17). */
      transition:
        transform var(--pb-motion-base) var(--pb-ease),
        color var(--pb-motion-base) var(--pb-ease);
    }

    .Timer_module_css_lg {
      font-size: var(--pb-font-display);
    }

    .Timer_module_css_md {
      font-size: var(--pb-font-h1);
    }

    .Timer_module_css_urgent {
      color: var(--pb-danger);
      transform: scale(1.15);
      animation: pb-timer-pulse var(--pb-motion-pulse) ease-in-out infinite;
    }

    /* One beat per second (≤ 3 flashes/s); reduced motion sets --pb-motion-pulse to 0 → no pulse. */
    @keyframes pb-timer-pulse {
      0%,
      100% {
        opacity: 1;
      }
      50% {
        opacity: 0.7;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .Timer_module_css_urgent {
        transform: none;
      }
    }

    .Timer_module_css_paused {
      color: var(--pb-text-muted);
    }

    .Timer_module_css_pauseGlyph {
      font-size: 0.5em;
    }

    .Timer_module_css_digits {
      display: inline-block;
    }

    /* The last five seconds say it in words as well as colour (T-0779 F15). Beside the digits, inside the
   chip: a word hung under the chip ran into the deadline bar and the row below (T-0779 F2). The TV
   body token is 36 px, above the 32 px floor. */
    .Timer_module_css_hurry {
      color: var(--pb-danger);
      font-size: var(--pb-font-body);
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
      pointer-events: none;
    }

    .PlayerChips_module_css_list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      gap: var(--pb-space-3);
      max-width: 100%;
    }

    .PlayerChips_module_css_row {
      /* Wraps so 16 players stay visible (two rows of sm chips at 1080p) instead of being clipped. */
      flex-wrap: wrap;
      gap: var(--pb-space-2) var(--pb-space-3);
    }

    .PlayerChips_module_css_grid {
      flex-wrap: wrap;
      justify-content: center;
    }

    .PlayerChips_module_css_start {
      justify-content: flex-start;
    }

    .PlayerChips_module_css_item {
      min-width: 0;
      max-width: 100%;
    }

    /* A new chip pops into place (opt-in via `enter`; keys are player ids, so only a fresh mount pops). */
    /* I-029 A: a joiner walks in from the left (the QR's side on the lobby) as it pops. */
    .PlayerChips_module_css_enter {
      animation: pb-chip-walk var(--pb-motion-base) var(--pb-ease) both;
      transform-origin: center;
    }
    @keyframes pb-chip-walk {
      0% {
        opacity: 0;
        transform: translateX(-40px) scale(0.8);
      }
      60% {
        opacity: 1;
        transform: translateX(4px) scale(1.05);
      }
      100% {
        opacity: 1;
        transform: none;
      }
    }
    /* I-029 C: the newest chip is welcomed — a gold ring that fades over a second, once the walk has
   landed (the one easing; the chip's own rings — active, back — are its own rules). */
    .PlayerChips_module_css_enter > *:not([class*='_active_']) {
      outline: 3px solid transparent;
      outline-offset: 2px;
      border-radius: 999px;
      animation: pb-chip-welcome var(--pb-motion-pulse) var(--pb-ease) var(--pb-motion-base) both;
    }
    @keyframes pb-chip-welcome {
      from {
        outline-color: var(--pb-accent-2);
      }
      to {
        outline-color: transparent;
      }
    }

    /* Empty seats: the outline of a `lg` chip (the size in force whenever seats are shown). */
    .PlayerChips_module_css_seat {
      --pb-chip-size: calc(var(--pb-font-h2) * 1.6);
      display: inline-flex;
      align-items: center;
      width: 7em;
      font-size: var(--pb-font-h2);
      padding: var(--pb-space-1) var(--pb-space-4) var(--pb-space-1) var(--pb-space-1);
      border-radius: 999px;
      border: 2px dashed var(--pb-text-muted);
      opacity: 0.45;
    }

    .PlayerChips_module_css_seatDisc {
      width: var(--pb-chip-size);
      height: var(--pb-chip-size);
      border-radius: 50%;
      background: var(--pb-surface-2);
      flex-shrink: 0;
    }

    /* Materials R2: source adaptations and new relief paint are recorded in SOURCES.PlayerChips_module_css_md. */
    .PlayerChips_module_css_seat {
      background: linear-gradient(
        180deg,
        transparent,
        color-mix(in srgb, var(--pb-surface-2) 40%, transparent)
      );
    }
    .PlayerChips_module_css_seatDisc {
      background: radial-gradient(
        circle at 50% 55%,
        var(--pb-bg) 0 63%,
        var(--pb-surface-2) 67% 74%,
        color-mix(in srgb, var(--pb-text) 18%, var(--pb-surface-2)) 78%,
        var(--pb-surface-2) 82%
      );
    }
    :root[data-theme='contrast'] .PlayerChips_module_css_seat {
      background: transparent;
    }
    :root[data-theme='contrast'] .PlayerChips_module_css_seatDisc {
      background: var(--pb-surface-2);
    }

    .Reveal_module_css_list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: var(--pb-space-3);
      width: 100%;
    }

    .Reveal_module_css_item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--pb-space-5);
      padding: var(--pb-space-3) var(--pb-space-5);
      border-radius: var(--pb-radius);
      border: 1px solid var(--pb-border);
      background: var(--pb-surface);
      animation: global(pb-rise) var(--pb-motion-base) var(--pb-ease) both;
    }

    .Reveal_module_css_emphasis {
      background: var(--pb-surface-2);
      outline: 3px solid var(--pb-accent-2);
    }

    .Reveal_module_css_main {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .Reveal_module_css_text {
      font-size: var(--pb-font-h2);
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .Reveal_module_css_detail {
      color: var(--pb-text-muted);
      font-size: var(--pb-font-caption);
    }

    .Reveal_module_css_aside {
      display: flex;
      align-items: center;
      gap: var(--pb-space-2);
      flex-shrink: 0;
    }

    /* A burst is positioned by its origin (`--j-x`, `--j-y`, any length) inside the nearest positioned ancestor.
   Every particle moves by transform + opacity only (compositor, 60 fps on a phone). */
    .Juice_module_css_burst {
      position: absolute;
      left: var(--j-x, 50%);
      top: var(--j-y, 50%);
      width: 0;
      height: 0;
      pointer-events: none;
      z-index: 5;
    }

    .Juice_module_css_p {
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      animation: fly var(--j-ms, 900ms) cubic-bezier(0.2, 0.7, 0.3, 1) var(--j-delay, 0ms) 1 both;
      will-change: transform, opacity;
    }

    .Juice_module_css_sparks {
      width: 6px;
      height: 18px;
      margin: -9px -3px;
      border-radius: 3px;
    }

    /* A coin, not a dot: gold face, darker rim, an inner ring and a glint. Fixed colours, so it reads as money
   on every theme (the accent tones are green on some). */
    .Juice_module_css_coins {
      width: 36px;
      height: 36px;
      margin: -18px;
      border-radius: 50%;
      border: 4px solid #b27a12;
      background: radial-gradient(circle at 35% 30%, #fff3b0 0 14%, #f6c744 15% 100%);
      box-shadow:
        inset 0 0 0 3px #e0a623,
        0 2px 6px rgb(0 0 0 / 45%);
    }

    .Juice_module_css_confetti {
      width: 12px;
      height: 20px;
      margin: -10px -6px;
      border-radius: 3px;
    }

    .Juice_module_css_dust {
      width: 28px;
      height: 28px;
      margin: -14px;
      border-radius: 50%;
    }

    .Juice_module_css_t0 {
      background-color: var(--pb-accent);
    }
    .Juice_module_css_t1 {
      background-color: var(--pb-accent-2);
    }
    .Juice_module_css_t2 {
      background-color: var(--pb-accent-3);
    }
    .Juice_module_css_t3 {
      background-color: var(--pb-info);
    }

    /* Dust is always grey: the tone only varies sparks and confetti. */
    .Juice_module_css_dust.Juice_module_css_t0,
    .Juice_module_css_dust.Juice_module_css_t1,
    .Juice_module_css_dust.Juice_module_css_t2,
    .Juice_module_css_dust.Juice_module_css_t3 {
      background-color: var(--pb-text-muted);
    }

    @keyframes fly {
      0% {
        opacity: 1;
        transform: translate3d(0, 0, 0) rotate(0deg) scale(var(--j-scale, 1));
      }
      55% {
        opacity: 1;
        transform: translate3d(var(--j-dx), var(--j-dy), 0) rotate(calc(var(--j-rot) * 0.6))
          scale(var(--j-scale, 1));
      }
      100% {
        opacity: 0;
        transform: translate3d(calc(var(--j-dx) * 1.1), calc(var(--j-dy) + var(--j-fall)), 0)
          rotate(var(--j-rot)) scale(calc(var(--j-scale, 1) * 0.8));
      }
    }

    /* The number: a pop on every change (the keyed re-mount restarts it). */
    .Juice_module_css_num {
      display: inline-block;
      font-variant-numeric: tabular-nums;
      animation: pop 420ms cubic-bezier(0.2, 1.6, 0.4, 1) 1;
    }
    .Juice_module_css_num[data-first] {
      animation: none;
    }

    @keyframes pop {
      0% {
        transform: scale(1);
      }
      35% {
        transform: scale(1.25);
      }
      100% {
        transform: scale(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .Juice_module_css_num {
        animation: none;
      }
    }

    /* Full-screen, behind every word: z -1 inside the TV frame's own stacking context (TvFrame
   isolation) paints above the frame background and under all content, so a piece shows only in the
   gaps and never over text. Fixed to the viewport (the TV surface is a zoomed 1920×1080 design, so
   px, never vh). The fall is transform + opacity only. */
    .Confetti_module_css_confetti {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: -1;
    }

    .Confetti_module_css_piece {
      position: absolute;
      top: -32px;
      width: 16px;
      height: 26px;
      border-radius: 3px;
      opacity: 0.95;
      animation: global(pb-confetti) var(--pb-motion-confetti, 3000ms) linear infinite;
      will-change: transform;
    }

    /* One faster fall: each piece waits above the screen for its stagger, then goes back up there
   when it lands. Never held at the last frame: a 16:10 or 4:3 stage (1200, 1440 px) is deeper
   than the 1180 px fall, so the pieces would rest on the results (T-0171 review). */
    .Confetti_module_css_confetti[data-once] .Confetti_module_css_piece {
      animation-duration: calc(var(--pb-motion-confetti, 3000ms) * 2 / 3);
      animation-iteration-count: 1;
      animation-fill-mode: backwards;
    }

    .Confetti_module_css_c0 {
      background: var(--pb-accent);
    }

    .Confetti_module_css_c1 {
      background: var(--pb-accent-2);
    }

    .Confetti_module_css_c2 {
      background: var(--pb-accent-3);
    }

    .Confetti_module_css_c3 {
      background: var(--pb-info);
    }

    /* Every screen rises on mount (the phone was the only surface that hard-cut). Fill `backwards`,
   not `both`: a retained transform would make this frame the containing block for any future
   position: fixed game element. Taps are never blocked (opacity does not gate pointer events). */
    .Screen_module_css_screen {
      position: relative; /* the predecessor's snapshot overlays this frame (review-loop #18) */
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      overscroll-behavior: none;
      animation: global(pb-rise) var(--pb-motion-base) var(--pb-ease) backwards;
      animation-delay: var(
        --pb-screen-delay,
        0ms
      ); /* I-039 A: the shell can hold the rise a beat */
    }

    /* A leaving screen's snapshot, parked in the parent: on top, inert, fading over the base token. */
    .Screen_module_css_ghost {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: flex;
      flex-direction: column;
      pointer-events: none;
      animation: global(pb-fade-out) var(--pb-motion-base) var(--pb-ease) both;
    }

    /* Cloned nodes would replay their entrance keyframes; freeze them where they were. */
    .Screen_module_css_ghost * {
      animation: none !important;
      transition: none !important;
    }

    .Screen_module_css_title {
      padding: var(--pb-space-4) var(--pb-space-4) 0;
      text-wrap: balance;
    }

    .Screen_module_css_body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: var(--pb-space-4);
      display: flex;
      flex-direction: column;
      gap: var(--pb-space-4);
    }

    .Screen_module_css_footer {
      position: sticky;
      bottom: 0;
      padding: var(--pb-space-3) var(--pb-space-4)
        calc(var(--pb-space-3) + var(--pb-safe-bottom, env(safe-area-inset-bottom)));
      background: linear-gradient(to top, var(--pb-bg) 70%, transparent);
    }

    /* A sideways phone in Safari (≈ 330 px tall): tighter body padding, the height goes to the game. */
    @media (orientation: landscape) and (max-height: 420px) {
      .Screen_module_css_body {
        padding: var(--pb-space-2) var(--pb-space-4);
      }
      .Screen_module_css_footer {
        padding: 4px var(--pb-space-4)
          calc(4px + var(--pb-safe-bottom, env(safe-area-inset-bottom)));
      }
    }

    /* A long body (six-row results, a wager list on an SE) folds under the footer and the last line is
   cut mid-glyph (review-loop, six-player results on an iPhone). Browsers with scroll-driven animations fade the body's bottom 28 px
   while there is more below and lift the fade at the end; a body that does not scroll has no
   timeline, so no fade. Only meaningful overflow (the same threshold as the cue) folds: a few
   pixels of card-arrival overshoot must not fade a whole row. Others keep the plain fold. */
    @property --pb-fold {
      syntax: '<length>';
      inherits: false;
      initial-value: 0px;
    }

    @supports (animation-timeline: scroll()) {
      .Screen_module_css_body {
        mask-image: linear-gradient(to bottom, #000 calc(100% - var(--pb-fold)), transparent);
      }
      .Screen_module_css_body[data-fold] {
        animation: pb-fold linear both;
        animation-timeline: scroll(self);
      }
      /* fill1: a title drawn down to its bottom edge (the results' award chips) sat flush on the body's
     clip line, so a row scrolled half out read as hidden under the chips — at 200 % text most of a
     name. Scrolled away from the top, the body keeps the clear strip it has at rest (its own top
     padding) and then fades in over twice the caption size, so nothing touches the title at any
     text size. Paint only: every box stays where it was, and at the top there is no mask at all. */
      .Screen_module_css_body.Screen_module_css_fadeTop {
        mask-image: linear-gradient(
          to bottom,
          transparent var(--pb-fold-clear),
          #000 calc(var(--pb-fold-clear) + var(--pb-fold-top)),
          #000 calc(100% - var(--pb-fold)),
          transparent
        );
        animation: pb-fold-top linear both;
        animation-timeline: scroll(self);
      }
      .Screen_module_css_body.Screen_module_css_fadeTop[data-fold] {
        animation:
          pb-fold linear both,
          pb-fold-top linear both;
        animation-timeline: scroll(self), scroll(self);
      }
    }

    @property --pb-fold-top {
      syntax: '<length>';
      inherits: false;
      initial-value: 0px;
    }
    @property --pb-fold-clear {
      syntax: '<length>';
      inherits: false;
      initial-value: 0px;
    }

    @keyframes pb-fold-top {
      0% {
        --pb-fold-clear: 0px;
        --pb-fold-top: 0px;
      }
      8%,
      100% {
        --pb-fold-clear: var(--pb-space-4);
        --pb-fold-top: calc(var(--pb-font-caption) * 2);
      }
    }

    @keyframes pb-fold {
      0%,
      92% {
        --pb-fold: 72px; /* I-066 A: one cut row deep */
      }
      100% {
        --pb-fold: 0px;
      }
    }

    /* ── I-788 A (design review A, refines I-066 B / I-187): "more below" is a slim row of its own at the
   top of the footer — a grab bar and the words — never a pill floating over the body's last line or
   the button's own words. The row is laid out whenever the body overflows (the body gives up its
   height), and only fades out at the end, so nothing shifts under a finger. With no footer the same
   row sits in the bottom safe area. The whole row is the button: 28 px drawn, 40 px to the thumb. */
    .Screen_module_css_cue {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      min-height: 28px;
      margin: 0 0 2px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--pb-text-muted);
      font: inherit;
      font-size: calc(var(--pb-font-caption) * 0.86);
      font-weight: 700;
      line-height: 1.1;
      cursor: pointer;
      transition: opacity var(--pb-motion-base) var(--pb-ease);
    }
    .Screen_module_css_cue::before {
      content: '';
      width: 28px;
      height: 3px;
      border-radius: 3px;
      background: currentColor;
      opacity: 0.6;
      flex: none;
    }
    /* The thumb target reaches up to the footer's top edge (44 px), never down over the button. */
    .Screen_module_css_cue::after {
      content: '';
      position: absolute;
      inset: calc(-1 * var(--pb-space-4)) 0 0;
    }
    .Screen_module_css_cue[data-on='false'] {
      opacity: 0;
      visibility: hidden;
      transition:
        opacity var(--pb-motion-base) var(--pb-ease),
        visibility 0s linear var(--pb-motion-base);
    }
    @media (prefers-reduced-motion: reduce) {
      .Screen_module_css_cue,
      .Screen_module_css_cue[data-on='false'] {
        transition: none;
      }
    }
    :root[data-motion='off'] .Screen_module_css_cue,
    :root[data-motion='off'] .Screen_module_css_cue[data-on='false'] {
      transition: none;
    }

    /* No footer: the row alone, in the bottom safe area. */
    .Screen_module_css_cueOnly {
      flex-shrink: 0;
      padding: var(--pb-space-3) var(--pb-space-4)
        calc(4px + var(--pb-safe-bottom, env(safe-area-inset-bottom)));
    }

    @media (orientation: landscape) and (max-height: 420px) {
      .Screen_module_css_cue {
        min-height: 22px;
        margin: 0;
      }
      .Screen_module_css_cue::after {
        inset: -4px 0 0;
      }
      .Screen_module_css_cueOnly {
        padding: 4px var(--pb-space-4)
          calc(2px + var(--pb-safe-bottom, env(safe-area-inset-bottom)));
      }
    }

    .PrimaryButton_module_css_button {
      width: 100%;
      min-height: 56px;
      padding: var(--pb-space-3) var(--pb-space-5);
      border-radius: var(--pb-radius);
      font-size: var(--pb-font-button);
      font-weight: 800;
      letter-spacing: 0.01em;
      transition:
        transform var(--pb-motion-fast) var(--pb-ease),
        opacity var(--pb-motion-fast) var(--pb-ease);
    }

    .PrimaryButton_module_css_button:active:not([aria-disabled='true']) {
      transform: scale(0.97);
      /* brightens accent, danger, success and the neutral surface-2 fill in every theme (R-049) */
      filter: brightness(1.12);
    }

    /* Disabled reads as "not yet", not as a dimmer version of the action (label contrast 6.9:1): an
   empty dashed outline, never a filled neutral button (T-0392: that read like an enabled one). */
    .PrimaryButton_module_css_button[aria-disabled='true'] {
      background: transparent;
      color: var(--pb-text-muted);
      border: 2px dashed var(--pb-text-muted);
      cursor: default;
    }

    .PrimaryButton_module_css_wrap {
      display: flex;
      flex-direction: column;
      gap: var(--pb-space-1);
      width: 100%;
    }

    .PrimaryButton_module_css_reason {
      text-align: center;
      font-size: var(--pb-font-caption);
      color: var(--pb-text-muted);
    }

    /* A tap on a disabled button: three sideways jolts (global keyframe; 0 ms under reduced motion). */
    .PrimaryButton_module_css_shake {
      animation: global(pb-shake) var(--pb-motion-base) var(--pb-ease);
    }

    .PrimaryButton_module_css_accent {
      background: var(--pb-accent);
      color: var(--pb-on-accent);
    }

    .PrimaryButton_module_css_neutral {
      background: var(--pb-surface-2);
      color: var(--pb-text);
      box-shadow: inset 0 0 0 1px var(--pb-border);
    }

    .PrimaryButton_module_css_danger {
      background: var(--pb-danger);
      color: var(--pb-on-accent);
    }

    .PrimaryButton_module_css_success {
      background: var(--pb-accent-3);
      color: var(--pb-on-accent);
    }

    .PrimaryButton_module_css_done,
    .PrimaryButton_module_css_done[aria-disabled='true'] {
      background: var(--pb-accent-3);
      color: var(--pb-on-accent);
      border-color: transparent; /* dashed is for the waiting state only */
    }

    /* The last 5 s for an unanswered phone (`data-urgent` on the controller shell): a danger outline
   and one nudge when the attribute lands — no JS timer. A button disabled by an empty answer gets
   nothing (there is nothing to press yet); the header cue and haptic still cover that player. */
    [data-urgent]
      .PrimaryButton_module_css_button.PrimaryButton_module_css_accent:not([aria-disabled='true']) {
      outline: 3px solid var(--pb-danger);
      outline-offset: 2px;
      animation: pb-nudge var(--pb-motion-slow) var(--pb-ease) 1;
    }

    @keyframes pb-nudge {
      0%,
      100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.03);
      }
    }

    /* The ✓ pops once each time a done button mounts (R-063); 0 ms under reduced motion. */
    /* The gap is a margin: a trailing space inside an inline-block collapses, so every done button
   read "✓Submitted" / "✓You're ready". */
    .PrimaryButton_module_css_check {
      display: inline-block;
      margin-right: 0.35em;
      animation: global(pb-pop) var(--pb-motion-fast) var(--pb-ease) both;
    }

    /* T-0225: sent, not yet taken. Neutral and quiet: no ✓, not the success green (that reads as
   delivered and the phone goes down while the send may still be lost). */
    .PrimaryButton_module_css_busy,
    .PrimaryButton_module_css_busy[aria-disabled='true'] {
      background: var(--pb-surface-2);
      color: var(--pb-text);
      border-color: transparent;
      box-shadow: inset 0 0 0 1px var(--pb-border);
    }

    .WaitingScreen_module_css_center {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--pb-space-3);
      text-align: center;
      padding: var(--pb-space-6) 0;
    }

    .WaitingScreen_module_css_glyph {
      display: grid;
      place-items: center;
      width: 96px;
      height: 96px;
      border-radius: 50%;
      font-size: 48px;
      font-weight: 900;
      background: var(--pb-surface);
      color: var(--pb-text-muted);
    }

    .WaitingScreen_module_css_done {
      background: var(--pb-accent-3);
      color: var(--pb-on-accent);
    }

    .WaitingScreen_module_css_watch {
      color: var(--pb-info);
    }

    .WaitingScreen_module_css_oops {
      color: var(--pb-accent-2);
    }

    .WaitingScreen_module_css_title {
      text-wrap: balance;
    }

    .WaitingScreen_module_css_hint {
      color: var(--pb-text-muted);
    }

    /* Waiting for others / watching the TV: the glyph breathes on a 2 s loop so a glance confirms the
   phone is alive (review-loop #22). Reduced motion zeroes the pulse token → no loop. */
    .WaitingScreen_module_css_wait,
    .WaitingScreen_module_css_watch {
      animation: pb-breathe calc(var(--pb-motion-pulse) * 2) ease-in-out infinite;
    }

    @keyframes pb-breathe {
      0%,
      100% {
        transform: scale(1);
        opacity: 1;
      }
      50% {
        transform: scale(1.06);
        opacity: 0.8;
      }
    }

    .PadGlyph_module_css_glyph {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 1.6em;
      height: 1.6em;
      padding: 0 0.4em;
      margin-inline-end: var(--pb-space-2);
      border-radius: var(--pb-radius-lg);
      background: var(--pb-surface-2);
      border: 2px solid currentColor;
      color: inherit;
      font-size: 0.8em;
      font-weight: 800;
      line-height: 1;
      vertical-align: middle;
    }

    .TextAnswer_module_css_kicker {
      font-size: var(--pb-font-caption);
      font-weight: 700;
      color: var(--pb-accent-2);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .TextAnswer_module_css_prompt {
      font-size: var(--pb-font-h2);
      font-weight: 800;
      text-wrap: balance;
    }

    .TextAnswer_module_css_input {
      width: 100%;
      min-height: 120px;
      padding: var(--pb-space-3) var(--pb-space-4);
      border-radius: var(--pb-radius);
      border: 2px solid var(--pb-surface-2);
      background: var(--pb-surface);
      font-size: var(--pb-font-h2);
      font-weight: 600;
      line-height: 1.3;
      resize: none;
    }

    /* I-795 I: a lead (the drawing to guess) takes the height left over; the field is one line that
   grows with its text (field-sizing where supported), so the box and Send are always on screen. */
    .TextAnswer_module_css_lead {
      flex: 1 1 0;
      min-height: 64px;
      display: grid;
      grid-template: minmax(0, 1fr) / minmax(0, 1fr);
    }

    /* The keyboard is up (visual viewport short): the lead may shrink to nothing and the prompt
   drops to body size, so the field and Send stay above the keys even on a 320 × 568 phone. */
    .TextAnswer_module_css_squeezed .TextAnswer_module_css_lead {
      min-height: 0;
      margin-top: calc(-1 * var(--pb-space-4)); /* the body's top padding goes to the field too */
    }

    .TextAnswer_module_css_squeezed .TextAnswer_module_css_prompt {
      font-size: var(--pb-font-body);
    }

    .TextAnswer_module_css_inputOne {
      flex: none;
      min-height: 0;
      padding: var(--pb-space-2) var(--pb-space-3);
      font-size: var(--pb-font-body);
      field-sizing: content;
      max-height: calc(3lh + 2 * var(--pb-space-2));
    }

    .TextAnswer_module_css_input:focus {
      border-color: var(--pb-accent);
      outline: none;
    }

    .TextAnswer_module_css_input:disabled {
      opacity: 0.7;
    }

    /* Submitted: the answer as a card in place of the input. */
    .TextAnswer_module_css_sent {
      display: flex;
      flex-direction: column;
      gap: var(--pb-space-1);
      padding: var(--pb-space-4);
      border-radius: var(--pb-radius);
      background: var(--pb-surface);
      border: 2px solid var(--pb-accent-3);
    }

    .TextAnswer_module_css_sentLabel,
    .TextAnswer_module_css_sentHint {
      font-size: var(--pb-font-caption);
      color: var(--pb-text-muted);
    }

    .TextAnswer_module_css_sentText {
      font-size: var(--pb-font-h2);
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .TextAnswer_module_css_sentHint {
      margin-top: var(--pb-space-2);
    }

    .TextAnswer_module_css_late {
      font-size: var(--pb-font-caption);
      font-weight: 700;
      color: var(--pb-accent-2);
    }

    .TextAnswer_module_css_counter {
      text-align: right;
      font-size: var(--pb-font-caption);
      color: var(--pb-text-muted);
      font-variant-numeric: tabular-nums;
    }

    /* ── I-001 A: the field joins the last 5 s (`data-urgent` on the controller shell, as the primary
   button does): a danger border and the shell's once-a-second beat, so the whole card escalates,
   not one label. --pb-motion-pulse is 0 under reduced motion → no beat, the border alone. */
    [data-urgent] .TextAnswer_module_css_input:not(:disabled) {
      border-color: var(--pb-danger);
      animation: pb-urge var(--pb-motion-pulse) ease-in-out infinite;
    }
    @keyframes pb-urge {
      0%,
      100% {
        opacity: 1;
      }
      50% {
        opacity: 0.7;
      }
    }

    /* ── I-001 B: the counter bumps on each keystroke (transform only; remounted per change). */
    .TextAnswer_module_css_typed {
      transform-origin: right center;
      animation: global(pb-bump) var(--pb-motion-fast) var(--pb-ease) both;
    }

    /* ── I-001 C: an empty field breathes after 3 s (pb-breathe, the lobby's idle cue — defined only
   without reduced motion, so it is simply absent there). The urgent rule above outranks it. */
    .TextAnswer_module_css_stalled {
      animation: global(pb-breathe) calc(var(--pb-motion-pulse) * 2) ease-in-out infinite;
    }
    /* The in-app motion switch: no beat, no breath (the tokens already collapse to 0; be explicit). */
    :root[data-motion='off'] .TextAnswer_module_css_stalled,
    :root[data-motion='off'] [data-urgent] .TextAnswer_module_css_input:not(:disabled) {
      animation: none;
    }

    .ChoiceGrid_module_css_kicker {
      font-size: var(--pb-font-caption);
      font-weight: 700;
      color: var(--pb-accent-2);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    /* tone="final": the kicker matches the TV's accent "final question" kicker (R-064). */
    .ChoiceGrid_module_css_kickerFinal {
      color: var(--pb-accent);
    }

    .ChoiceGrid_module_css_prompt {
      font-size: var(--pb-font-h2);
      font-weight: 800;
      text-wrap: balance;
    }

    .ChoiceGrid_module_css_grid {
      display: flex;
      flex-direction: column;
      gap: var(--pb-space-3);
    }

    /* fill (I-789 B, the design review): the answers share the height left under the question —
   each 66 px when there is room, down to its own content (one line: 50 px; the flex item's auto
   minimum, never a fixed one — a two-line label must not spill onto the next tile) on a short
   phone, so four fit an SE with no scroll. The tiles never stretch past 66 px, so nothing drifts
   when the status line lands. */
    .ChoiceGrid_module_css_layout {
      display: flex;
      flex-direction: column;
      gap: var(--pb-space-4);
      flex: 1 1 auto;
      /* min-height stays auto: the block never shrinks below its tiles' content, so a long label
     scrolls the body instead of sliding under the status line */
    }

    .ChoiceGrid_module_css_head {
      display: flex;
      flex-direction: column;
      gap: var(--pb-space-2);
    }

    .ChoiceGrid_module_css_plain {
      display: contents;
    }

    .ChoiceGrid_module_css_fill {
      flex: 1 1 auto;
      gap: var(--pb-space-2);
    }

    /* Basis 0 + grow: a tile's floor is its content (one line: 50 px — the block never shrinks below
   it, so nothing slides under the status line), its ceiling 66 px or two lines of its own text,
   whichever is taller (a two-line answer is never clipped). */
    .ChoiceGrid_module_css_fill .ChoiceGrid_module_css_choice {
      flex: 1 1 0;
      min-height: auto;
      max-height: max(66px, calc(2lh + 2 * var(--pb-space-2) + 6px));
