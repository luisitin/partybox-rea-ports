      padding: var(--pb-space-2) var(--pb-space-4);
    }

    .ChoiceGrid_module_css_fill .ChoiceGrid_module_css_letter {
      width: max(
        28px,
        1.5em
      ); /* grows with 200 % text, so the letter never spills out of its disc */
      height: max(28px, 1.5em);
    }

    /* Four short answers: two by two, each tile at least 66 px; the ✓/✗ goes to the corner so the
   label keeps the width… */
    .ChoiceGrid_module_css_fill.ChoiceGrid_module_css_two {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-content: start;
    }

    .ChoiceGrid_module_css_fill.ChoiceGrid_module_css_two .ChoiceGrid_module_css_choice {
      min-height: 66px;
      max-height: none;
    }

    /* …unless half the width holds under 7 em of the tiles' own text (200 % text): then one column of
   content-high tiles. The query measures the layout, whose font is the tiles' body size. */
    .ChoiceGrid_module_css_layout {
      container-type: inline-size;
      font-size: var(--pb-font-body);
    }

    @container (max-width: 14em) {
      .ChoiceGrid_module_css_fill.ChoiceGrid_module_css_two {
        grid-template-columns: minmax(0, 1fr);
      }
      .ChoiceGrid_module_css_fill.ChoiceGrid_module_css_two .ChoiceGrid_module_css_choice {
        min-height: 44px;
      }
    }

    .ChoiceGrid_module_css_two .ChoiceGrid_module_css_choice {
      position: relative;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--pb-space-1) var(--pb-space-2);
      padding-inline: var(--pb-space-3);
    }

    /* a word is never split: the label is at least its longest word, and drops under the letter when
   the two do not fit side by side */
    .ChoiceGrid_module_css_two .ChoiceGrid_module_css_label {
      flex: 1 1 0;
      min-width: min-content;
      overflow-wrap: break-word;
    }

    .ChoiceGrid_module_css_two .ChoiceGrid_module_css_mark {
      position: absolute;
      top: 2px;
      right: var(--pb-space-2);
      font-size: var(--pb-font-caption);
    }

    /* The reserved status line: the space of "✓ Locked in", held from the first frame. */
    .ChoiceGrid_module_css_reserved {
      visibility: hidden;
      animation: none;
    }

    /* A phone wraps "✓ Locked in with 12 s to spare — look at the TV" to two lines (an iPhone 15
   too): the line holds two from the start, so the tiles above never give up height on the tap. */
    @media (max-width: 440px) {
      .ChoiceGrid_module_css_layout ~ .ChoiceGrid_module_css_locked {
        min-height: 2lh;
      }
    }

    /* A short phone (an SE, 568 px): the question steps down to body size and the gaps tighten. */
    @media (max-height: 600px) and (orientation: portrait) {
      .ChoiceGrid_module_css_layout {
        gap: var(--pb-space-2);
      }
      .ChoiceGrid_module_css_layout .ChoiceGrid_module_css_prompt {
        font-size: var(--pb-font-body);
      }
      .ChoiceGrid_module_css_layout .ChoiceGrid_module_css_kicker {
        letter-spacing: 0;
      }
      .ChoiceGrid_module_css_fill .ChoiceGrid_module_css_choice {
        padding-block: 7px; /* with the 24 px disc a one-line answer is 44 px: the touch floor */
      }
      .ChoiceGrid_module_css_fill .ChoiceGrid_module_css_letter {
        width: max(24px, 1.3em);
        height: max(24px, 1.3em);
      }
    }

    /* Sideways: the question holds the left, the answers the right, filling the height — a 2×2 for
   short answers (the review's drawing), a column of four when an answer is long (half a sideways
   phone would break its words). */
    @media (orientation: landscape) and (max-height: 500px) {
      .ChoiceGrid_module_css_layout {
        flex-direction: row;
        align-items: stretch;
        gap: var(--pb-space-4);
      }
      .ChoiceGrid_module_css_layout > .ChoiceGrid_module_css_head {
        flex: 1 1 0;
        min-width: 0;
        justify-content: center;
      }
      .ChoiceGrid_module_css_layout .ChoiceGrid_module_css_prompt {
        font-size: var(--pb-font-body);
      }
      .ChoiceGrid_module_css_layout > .ChoiceGrid_module_css_fill {
        flex: 1.3 1 0;
        min-width: 0;
      }
      .ChoiceGrid_module_css_layout > .ChoiceGrid_module_css_fill .ChoiceGrid_module_css_choice {
        max-height: none;
      }
      .ChoiceGrid_module_css_layout > .ChoiceGrid_module_css_fill.ChoiceGrid_module_css_two {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-auto-rows: minmax(0, 1fr);
        align-content: stretch;
      }
      .ChoiceGrid_module_css_layout
        > .ChoiceGrid_module_css_fill.ChoiceGrid_module_css_two
        .ChoiceGrid_module_css_choice {
        min-height: 0;
      }
    }

    .ChoiceGrid_module_css_choice {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: var(--pb-space-3);
      min-height: 64px;
      padding: var(--pb-space-3) var(--pb-space-4);
      border-radius: var(--pb-radius);
      background: var(--pb-surface);
      border: 3px solid var(--pb-border);
      text-align: left;
      font-size: var(--pb-font-body);
      font-weight: 700;
      transition:
        transform var(--pb-motion-fast) var(--pb-ease),
        border-color var(--pb-motion-base) var(--pb-ease),
        background-color var(--pb-motion-base) var(--pb-ease),
        color var(--pb-motion-base) var(--pb-ease);
    }

    /* Press: the accent edge + darker fill land the instant the finger is down (R-049); the scale
   comes from the controller-surface rule in global.ChoiceGrid_module_css_css. */
    .ChoiceGrid_module_css_choice:active:not(:disabled) {
      border-color: var(--pb-accent);
      background: var(--pb-surface-2);
    }

    .ChoiceGrid_module_css_choice:active:not(:disabled) .ChoiceGrid_module_css_letter {
      transform: scale(1.12);
    }

    .ChoiceGrid_module_css_choice:disabled {
      cursor: default;
    }

    /* letters={false}: label + mark only. */
    .ChoiceGrid_module_css_noLetters {
      grid-template-columns: 1fr auto;
    }

    .ChoiceGrid_module_css_letter {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--pb-surface-2);
      font-weight: 900;
      transition:
        transform var(--pb-motion-fast) var(--pb-ease),
        background-color var(--pb-motion-base) var(--pb-ease),
        color var(--pb-motion-base) var(--pb-ease);
    }

    .ChoiceGrid_module_css_label {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .ChoiceGrid_module_css_mark {
      font-weight: 900;
      min-width: 1em;
      text-align: right;
      white-space: nowrap;
    }

    /* I-790 C: the reveal's words on the tiles ("✓ the answer", "you"); a two-by-two tile keeps the
   glyph only (its mark is a corner badge), where a wrong pick shows ✗ instead of the word. */
    .ChoiceGrid_module_css_tag {
      margin-left: 0.35em;
      font-size: var(--pb-font-caption);
      font-weight: 800;
    }

    .ChoiceGrid_module_css_glyphTight {
      display: none;
    }

    .ChoiceGrid_module_css_two .ChoiceGrid_module_css_tag {
      display: none;
    }

    .ChoiceGrid_module_css_two .ChoiceGrid_module_css_glyphTight {
      display: inline;
    }

    /* Lock-in: the chosen card settles with a small pop and its ✓ pops in (both 0 ms under reduced
   motion via the tokens; the border/fill/✓ state changes remain). The global pb-pop starts from
   opacity 0, so the card itself uses a local settle that never hides an already-visible button. */
    @keyframes pb-choice-settle {
      0% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.03);
      }
      100% {
        transform: scale(1);
      }
    }

    .ChoiceGrid_module_css_selected {
      border-color: var(--pb-accent);
      background: var(--pb-surface-2);
      animation: pb-choice-settle var(--pb-motion-base) var(--pb-ease) both;
    }

    .ChoiceGrid_module_css_selected .ChoiceGrid_module_css_mark {
      animation: global(pb-pop) var(--pb-motion-fast) var(--pb-ease) both;
    }

    .ChoiceGrid_module_css_correct {
      border-color: var(--pb-accent-3);
      background: var(--pb-surface-2);
    }

    .ChoiceGrid_module_css_correct .ChoiceGrid_module_css_mark {
      color: var(--pb-accent-3);
    }

    .ChoiceGrid_module_css_correct .ChoiceGrid_module_css_mark,

    .ChoiceGrid_module_css_dim {

    .ChoiceGrid_module_css_failed {

   danger so the thumb zone, not only the header, says "now". */
    [data-urgent] .ChoiceGrid_module_css_choice:not(:disabled) .ChoiceGrid_module_css_letter {
      background: var(--pb-danger);

    .ChoiceGrid_module_css_correct .ChoiceGrid_module_css_letter {

    .VoteList_module_css_kicker {

    .VoteList_module_css_header {
      position: sticky;
      top: calc(-1 * var(--pb-space-4));
      z-index: 1;
      margin: calc(-1 * var(--pb-space-4)) calc(-1 * var(--pb-space-4)) 0;
      padding: var(--pb-space-4) var(--pb-space-4) var(--pb-space-2);

    .VoteList_module_css_large {

    @media (orientation: landscape) and (max-height: 520px) {

      font-style: italic;
      font-weight: 600;
    }

    }

      letter-spacing: 0.06em;
    }

    /* A row's text keeps its width: the tag takes a line of its own under the text instead of
   squeezing a wrapped sentence into a narrow column (a Blanks card on an iPhone SE, review-loop
   #138) — and the letter stays beside the text, where a short card used to leave it stranded on
   a line by itself (Blanks review-loop #386). */
    .VoteList_module_css_option:has(.VoteList_module_css_tag) {
      flex-wrap: wrap;
    }

    .VoteList_module_css_option:has(.VoteList_module_css_tag) .VoteList_module_css_tag {

      animation: global(pb-pop) var(--pb-motion-fast) var(--pb-ease) both;
    }

    /* Lock-in: the chosen card settles with a small pop (0 ms under reduced motion via the token).
   The global pb-pop starts from opacity 0, so the card uses a local settle that never hides an
   already-visible button. */
    @keyframes pb-vote-settle {
      0% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.03);
      }
      100% {
        transform: scale(1);
      }
    }

    .VoteList_module_css_voted {
      border-color: var(--pb-accent);
      background: var(--pb-surface-2);
      animation: pb-vote-settle var(--pb-motion-base) var(--pb-ease) both;
    }

    /* Dimmed by token, not opacity: muted text on the page bg keeps >= 6.4:1 in every theme (R-070);
   opacity fell to ~2.2:1 in Daylight. .VoteList_module_css_mine is disabled and can never be .VoteList_module_css_voted. */
    .VoteList_module_css_mine,
    .VoteList_module_css_dim {
      color: var(--pb-text-muted);
      background: var(--pb-bg);
    }

    .VoteList_module_css_mine .VoteList_module_css_letter,
    .VoteList_module_css_dim .VoteList_module_css_letter {
      background: var(--pb-surface);
      color: var(--pb-text-muted);
    }

    .VoteList_module_css_locked {
      text-align: center;
      font-size: var(--pb-font-caption);
      font-weight: 700;
      color: var(--pb-accent-3);
      animation: global(pb-rise) var(--pb-motion-base) var(--pb-ease) both;
    }

    /* The tap never reached the server: the list is live again and the line says so (not colour-only). */
    .VoteList_module_css_failed {
      color: var(--pb-danger);
    }

    /* The last 5 s for an unanswered phone (`data-urgent` on the controller shell): the letters turn
   danger so the thumb zone, not only the header, says "now". */
    [data-urgent] .VoteList_module_css_option:not(:disabled) .VoteList_module_css_letter {
      background: var(--pb-danger);
      color: var(--pb-on-accent);
    }

    /* SecretCard: two faces on one turning plate. Transform-only (pb-flip's rule): the plate rotates,
   the faces never fade, backface-visibility hides whichever side points away. */
    .SecretCard_module_css_card {
      position: relative;
      perspective: 900px;
      width: 100%;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
      outline: none;
      border-radius: var(--pb-radius-lg);
    }
    .SecretCard_module_css_card:focus-visible {
      box-shadow: 0 0 0 3px var(--pb-accent-2);
    }
    .SecretCard_module_css_full {
      /* A floor, not a height: at 200 % text on a small phone the back's label and hint are taller than
     the card, so it grows to fit them (T-0038: Imposter's deal card clipped its text top and bottom
     on an SE, and the flex body shrank it further). Both faces share one grid cell (below). */
      min-height: clamp(11rem, 42dvh, 20rem);
      display: grid;
    }
    .SecretCard_module_css_mini {
      height: 3.5rem;
      border-radius: var(--pb-radius);
    }
    .SecretCard_module_css_turn {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      transition: transform var(--pb-motion-base) cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .SecretCard_module_css_full.SecretCard_module_css_shown .SecretCard_module_css_turn {
      transform: rotateY(180deg);
    }
    .SecretCard_module_css_mini.SecretCard_module_css_shown .SecretCard_module_css_turn {
      transform: rotateX(180deg);
    }
    .SecretCard_module_css_back,
    .SecretCard_module_css_face {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--pb-space-2);
      padding: var(--pb-space-4);
      border-radius: inherit;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      text-align: center;
      overflow: hidden;
    }
    .SecretCard_module_css_full .SecretCard_module_css_back,
    .SecretCard_module_css_full .SecretCard_module_css_face {
      border-radius: var(--pb-radius-lg);
    }
    /* full: the plate and both faces are in flow, stacked in one cell, so the taller face sizes the
   card; min-height is passed down so a short face still fills the floor. */
    .SecretCard_module_css_full .SecretCard_module_css_turn {
      position: relative;
      inset: auto;
      display: grid;
      min-height: inherit;
    }
    .SecretCard_module_css_full .SecretCard_module_css_back,
    .SecretCard_module_css_full .SecretCard_module_css_face {
      position: relative;
      inset: auto;
      grid-area: 1 / 1;
      min-height: inherit;
    }
    .SecretCard_module_css_mini .SecretCard_module_css_back,
    .SecretCard_module_css_mini .SecretCard_module_css_face {
      border-radius: var(--pb-radius);
      flex-direction: row;
      padding: 0 var(--pb-space-4);
      gap: var(--pb-space-3);
    }
    .SecretCard_module_css_back {
      background:
        repeating-linear-gradient(
          45deg,
          transparent 0 14px,
          color-mix(in srgb, var(--pb-accent) 14%, transparent) 14px 28px
        ),
        var(--pb-surface-2);
      border: 2px solid color-mix(in srgb, var(--pb-accent) 55%, var(--pb-surface-2));
      color: var(--pb-text);
    }
    .SecretCard_module_css_face {
      background: var(--pb-surface);
      border: 2px solid var(--pb-accent-2);
      color: var(--pb-text);
    }
    .SecretCard_module_css_full .SecretCard_module_css_face {
      transform: rotateY(180deg);
    }
    .SecretCard_module_css_mini .SecretCard_module_css_face {
      transform: rotateX(180deg);
    }
    /* WebKit can paint the inactive face through its backface. Match the control's visible side
   explicitly there; Chromium keeps the existing two-sided transform throughout the flip. */
    @supports (-webkit-backdrop-filter: none) {
      .SecretCard_module_css_card:not(.SecretCard_module_css_shown) .SecretCard_module_css_face,
      .SecretCard_module_css_card.SecretCard_module_css_shown .SecretCard_module_css_back {
        visibility: hidden;
      }
    }
    .SecretCard_module_css_glyph {
      font-size: 2.25rem;
      line-height: 1;
    }
    .SecretCard_module_css_mini .SecretCard_module_css_glyph {
      font-size: 1.375rem;
    }
    .SecretCard_module_css_backLabel {
      font-size: var(--pb-font-h2);
      font-weight: 800;
      line-height: 1.2;
    }
    .SecretCard_module_css_mini .SecretCard_module_css_backLabel {
      font-size: var(--pb-font-body);
    }
    .SecretCard_module_css_backHint {
      font-size: var(--pb-font-caption);
      color: var(--pb-text);
    }
    .SecretCard_module_css_mini .SecretCard_module_css_backHint {
      display: none;
    }
    /* The back's hand breathes until the player has learned the gesture (motion-gated). */
    @media (prefers-reduced-motion: no-preference) {
      .SecretCard_module_css_full:not(.SecretCard_module_css_shown) .SecretCard_module_css_glyph {
        animation: global(pb-breathe) 2.4s ease-in-out infinite;
      }
    }
    :root[data-motion='off'] .SecretCard_module_css_full .SecretCard_module_css_glyph {
      animation: none;
    }

    /* Materials R2: source adaptations and new relief paint are recorded in SOURCES.SecretCard_module_css_md. */
    .SecretCard_module_css_back {
      background:
        linear-gradient(
            90deg,
            color-mix(in srgb, var(--pb-accent) 5%, transparent) 50%,
            transparent 50%
          )
          0 0 / 4px 4px,
        linear-gradient(color-mix(in srgb, var(--pb-text) 3%, transparent) 50%, transparent 50%) 0
          0 / 4px 4px,
        repeating-linear-gradient(
          45deg,
          transparent 0 13px,
          color-mix(in srgb, var(--pb-accent) 12%, transparent) 13px 14px
        ),
        linear-gradient(
          135deg,
          color-mix(in srgb, var(--pb-text) 8%, transparent),
          transparent 35%,
          color-mix(in srgb, var(--pb-bg) 32%, transparent)
        ),
        var(--pb-surface-2);

    .SecretCard_module_css_face {
      background:
        linear-gradient(
            90deg,
            color-mix(in srgb, var(--pb-text-muted) 3%, transparent) 50%,
            transparent 50%
          )
          0 0 / 3px 3px,
        linear-gradient(
            color-mix(in srgb, var(--pb-text-muted) 3%, transparent) 50%,
            transparent 50%
          )
          0 0 / 3px 3px,
        linear-gradient(
          180deg,
          color-mix(in srgb, var(--pb-accent-2-fill) 8%, var(--pb-surface)),
          var(--pb-surface) 18%,
          var(--pb-surface) 82%,
          color-mix(in srgb, var(--pb-surface-2) 65%, var(--pb-surface))
        );
    }
    :root[data-theme='contrast'] .SecretCard_module_css_back,
    :root[data-theme='contrast'] .SecretCard_module_css_face {
