      /* Design tokens (docs/DESIGN_SYSTEM.md). Every colour, size and duration in the app comes from here.

      :root {

     the key art behind the start stage. Art is drawn for a dark stage; a light theme washes it

        --pb-tile-wash: 0%;

        --pb-surface-2: #272a52;
        --pb-text: #f5f6ff;

        --pb-accent: #ff5d8f;
        --pb-accent-2: #ffd166;
        --pb-accent-3: #06d6a0;
        --pb-danger: #ef476f;
        --pb-info: #4cc9f0;
        --pb-focus: #ffd166;
        --pb-on-accent: #1a0b12;
        /* accent-2 as a FILL (VIP pill, letter discs) — stays gold even where accent-2 text darkens */
        --pb-accent-2-fill: #ffd166;
        --pb-on-accent-2-fill: #1a0b12;
        /* optional edge for surfaces; only High Contrast sets it */
        --pb-border: transparent;
        /* the veil behind a pause curtain or a phone sheet: the theme's own ink, never a baked-in night */
        --pb-scrim: rgb(15 16 32 / 62%);

        --pb-player-1: #ff5d8f;
        --pb-player-2: #ffd166;
        --pb-player-3: #06d6a0;

        --pb-player-8: #f368e0;

        /* The two teams (P00 §6 TeamBanner, audit #52): Sun follows the theme's accent, Moon its info
     colour. Always shown with the shape (▲ / ●) and the name, never as a tint on a face. */
        --pb-team-sun: var(--pb-accent);
        --pb-team-moon: var(--pb-info);

        --pb-font-family:
          'Nunito Variable', 'Segoe UI Variable Display', 'Segoe UI', system-ui, -apple-system,
          Roboto, 'Helvetica Neue', Arial, sans-serif;
        --pb-font-mono: ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace;

        --pb-space-1: 4px;
        --pb-space-2: 8px;
        --pb-space-3: 12px;
        --pb-space-4: 16px;

     setting scales the words (16 px root = the same sizes as before). */

        --pb-font-h1: 1.75rem;
        --pb-font-h2: 1.375rem;
        --pb-font-body: 1.125rem;
        --pb-font-caption: 0.875rem;

      ._band_57e7b9 {

        animation: pb-rise var(--pb-motion-base) var(--pb-ease) var(--pb-motion-fast) both;
