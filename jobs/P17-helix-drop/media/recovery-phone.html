<!doctype html>
<html lang="en" data-surface="controller">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Helix Drop recovery phone</title>
    <style>
      /* Design tokens (docs/DESIGN_SYSTEM.md). Every colour, size and duration in the app comes from here.
   Colour tokens are re-declared per theme below (docs/DESIGN_SYSTEM.md → Themes).
   The TV shell and the controller shell each set a type-scale column via `data-surface` (stamped on
   <html> by main.tsx and on the shell element). */
      :root {
        --pb-bg: #0f1020;
        /* ADR-056: how much of the page colour washes over a game's art — the backdrop behind play and
     the key art behind the start stage. Art is drawn for a dark stage; a light theme washes it
     far more, so text drawn on the stage keeps its contrast. */
        --pb-art-wash: 16%;
        --pb-tile-wash: 0%;
        --pb-surface: #1c1e3a;
        --pb-surface-2: #272a52;
        --pb-text: #f5f6ff;
        --pb-text-muted: #b3b7d9;
        --pb-accent: #ff5d8f;
        --pb-accent-2: #ffd166;
        --pb-accent-3: #06d6a0;
        --pb-danger: #ef476f;
        --pb-info: #4cc9f0;
        --pb-focus: #ffd166;
        --pb-on-accent: #1a0b12;
        /* accent-2 as a FILL (VIP pill, letter discs) — stays gold even where accent-2 text darkens */
        --pb-accent-2-fill: #ffd166;
        --pb-on-accent-2-fill: #1a0b12;
        /* optional edge for surfaces; only High Contrast sets it */
        --pb-border: transparent;
        /* the veil behind a pause curtain or a phone sheet: the theme's own ink, never a baked-in night */
        --pb-scrim: rgb(15 16 32 / 62%);

        --pb-player-1: #ff5d8f;
        --pb-player-2: #ffd166;
        --pb-player-3: #06d6a0;
        --pb-player-4: #4cc9f0;
        --pb-player-5: #b388ff;
        --pb-player-6: #ff9f43;
        --pb-player-7: #48dbfb;
        --pb-player-8: #f368e0;

        /* The two teams (P00 §6 TeamBanner, audit #52): Sun follows the theme's accent, Moon its info
     colour. Always shown with the shape (▲ / ●) and the name, never as a tint on a face. */
        --pb-team-sun: var(--pb-accent);
        --pb-team-moon: var(--pb-info);

        --pb-font-family:
          'Nunito Variable', 'Segoe UI Variable Display', 'Segoe UI', system-ui, -apple-system,
          Roboto, 'Helvetica Neue', Arial, sans-serif;
        --pb-font-mono: ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace;

        --pb-space-1: 4px;
        --pb-space-2: 8px;
        --pb-space-3: 12px;
        --pb-space-4: 16px;
        --pb-space-5: 24px;
        --pb-space-6: 32px;
        --pb-space-7: 48px;
        --pb-space-8: 64px;

        --pb-radius: 12px;
        --pb-radius-lg: 24px;
        --pb-touch: 44px;

        --pb-motion-fast: 150ms;
        --pb-motion-base: 300ms;
        --pb-motion-slow: 600ms;
        --pb-motion-pulse: 1000ms;
        --pb-motion-confetti: 3000ms;
        --pb-ease: cubic-bezier(0.2, 0.8, 0.2, 1);

        /* phone column by default; the TV shell overrides. I-100 C: rem, so a phone's "larger text"
     setting scales the words (16 px root = the same sizes as before). */
        --pb-font-display: 3rem;
        --pb-font-h1: 1.75rem;
        --pb-font-h2: 1.375rem;
        --pb-font-body: 1.125rem;
        --pb-font-caption: 0.875rem;
        --pb-font-button: 1.25rem;
        --pb-chip-size: 40px;
      }

      /* ── Themes (src/theme.ts sets data-theme on <html>; 
ight is the :root default above) ────────
   Every palette keeps text ≥ 4.5:1 on bg/surface and button labels ≥ 4.5:1 on accents. Player
   colours stay bright in every theme — they are avatar discs, not text. */
      [data-theme='daylight'] {
        color-scheme: light;
        --pb-bg: #f6f5ff;
        --pb-art-wash: 90%;
        --pb-tile-wash: 45%;
        --pb-surface: #ffffff;
        --pb-surface-2: #e9e7fb;
        --pb-text: #171633;
        --pb-text-muted: #4a4c6e;
        --pb-accent: #c2185b;
        --pb-accent-2: #7a4b00;
        --pb-accent-3: #0b6b4e;
        --pb-danger: #c0143c;
        --pb-info: #0b6e99;
        --pb-focus: #c2185b;
        --pb-on-accent: #ffffff;
        --pb-accent-2-fill: #ffd166;
        --pb-on-accent-2-fill: #1a0b12;
        --pb-scrim: rgb(23 22 51 / 45%);
      }

      [data-theme='arcade'] {
        --pb-bg: #050014;
        --pb-surface: #14002e;
        --pb-surface-2: #23064a;
        --pb-text: #f0f6ff;
        --pb-text-muted: #a8b3d6;
        --pb-accent: #ff2bd6;
        --pb-accent-2: #00f0ff;
        --pb-accent-3: #39ff14;
        --pb-danger: #ff3860;
        --pb-info: #8f96ff;
        --pb-focus: #00f0ff;
        --pb-on-accent: #050014;
        --pb-accent-2-fill: #00f0ff;
        --pb-on-accent-2-fill: #050014;
        --pb-scrim: rgb(5 0 20 / 62%);
      }

      [data-theme='cabin'] {
        --pb-bg: #1d1410;
        --pb-surface: #2c211b;
        --pb-surface-2: #3d2e26;
        --pb-text: #fbf3e8;
        --pb-text-muted: #cbb8a6;
        --pb-accent: #ee8050;
        --pb-accent-2: #f2c14e;
        --pb-accent-3: #8fbf5a;
        --pb-danger: #f07070;
        --pb-info: #6fb3d2;
        --pb-focus: #f2c14e;
        --pb-on-accent: #1d1410;
        --pb-accent-2-fill: #f2c14e;
        --pb-on-accent-2-fill: #1d1410;
        --pb-scrim: rgb(29 20 16 / 62%);
      }

      [data-theme='contrast'] {
        --pb-bg: #000000;
        --pb-surface: #111111;
        --pb-surface-2: #242424;
        --pb-text: #ffffff;
        --pb-text-muted: #e6e6e6;
        --pb-accent: #ff4fa3;
        --pb-accent-2: #ffff00;
        --pb-accent-3: #00ff88;
        --pb-danger: #ff5555;
        --pb-info: #66ccff;
        --pb-focus: #ffffff;
        --pb-on-accent: #000000;
        --pb-accent-2-fill: #ffff00;
        --pb-on-accent-2-fill: #000000;
        --pb-border: #ffffff;
        --pb-scrim: rgb(0 0 0 / 78%);
      }
      [data-surface='tv'] {
        --pb-font-display: 128px;
        --pb-font-h1: 72px;
        --pb-font-h2: 48px;
        --pb-font-body: 36px;
        --pb-font-caption: 28px;
        --pb-tv-text-min: 28px; /* nothing read from the couch is smaller (T-0393) */
        --pb-font-button: 36px;
        --pb-chip-size: 72px;
        /* 5 % of 1920×1080 in px: viewport units ignore the fit zoom (src/tv/fit.ts). */
        --pb-overscan-x: 96px;
        --pb-overscan-y: 54px;
      }

      @media (prefers-reduced-motion: reduce) {
        :root {
          --pb-motion-fast: 0ms;
          --pb-motion-base: 0ms;
          --pb-motion-slow: 0ms;
          --pb-motion-pulse: 0ms;
          --pb-motion-confetti: 0ms;
        }
      }

      /* The in-app motion switch (a phone's card-style sheet, loop 311): the same collapse. */
      :root[data-motion='off'] {
        --pb-motion-fast: 0ms;
        --pb-motion-base: 0ms;
        --pb-motion-slow: 0ms;
        --pb-motion-pulse: 0ms;
        --pb-motion-confetti: 0ms;
      }
      ._screen_5dec39 {
        box-sizing: border-box;
        height: 100%;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: var(--pb-space-3);
        padding: var(--pb-space-3);
        color: var(--pb-text);
        overflow: hidden;
        overscroll-behavior: none;
      }
      ._screen_5dec39 header {
        flex: none;
        text-align: center;
      }
      ._screen_5dec39 h2 {
        margin: 0;
        font-size: var(--pb-font-h1);
        line-height: 1.2;
      }
      ._screen_5dec39 p {
        margin: var(--pb-space-1) 0 0;
        font-size: var(--pb-font-body);
      }
      ._tower_5dec39 {
        flex: 1;
        min-height: 0;
        max-height: calc(var(--pb-space-8) * 5);
      }
      ._screen_5dec39[data-stage] ._tower_5dec39 {
        max-height: calc(var(--pb-space-8) * 3);
      }
      ._pads_5dec39 {
        flex: none;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--pb-space-3);
        min-height: calc(var(--pb-touch) * 2.5);
      }
      ._pads_5dec39 button {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: var(--pb-space-2);
        border: var(--pb-space-1) solid var(--pb-accent-2);
        border-radius: var(--pb-radius);
        background: var(--pb-surface);
        color: var(--pb-text);
        font: inherit;
        font-size: var(--pb-font-button);
        touch-action: none;
        user-select: none;
        -webkit-touch-callout: none;
        transition: background var(--pb-motion-fast) var(--pb-ease);
      }
      ._pads_5dec39 button span {
        font-size: var(--pb-font-display);
        line-height: 1;
      }
      ._pads_5dec39 button[data-held] {
        background: var(--pb-accent-2-fill);
        color: var(--pb-on-accent-2-fill);
      }
      ._pads_5dec39 button:focus-visible {
        outline: var(--pb-space-1) solid var(--pb-focus);
        outline-offset: var(--pb-space-1);
      }
      ._receipt_5dec39,
      ._legend_5dec39 {
        flex: none;
        text-align: center;
        color: var(--pb-text-muted);
      }
      ._standings_5dec39 {
        flex: none;
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: var(--pb-space-1);
        font-size: var(--pb-font-body);
      }
      ._standings_5dec39 li {
        display: flex;
        align-items: center;
        gap: var(--pb-space-2);
        min-height: var(--pb-space-5);
        padding: 0 var(--pb-space-2);
        border-radius: var(--pb-radius);
      }
      ._standings_5dec39 li[data-me] {
        background: var(--pb-surface-2);
      }
      ._standings_5dec39 b {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      ._standings_5dec39 li > span:last-child {
        margin-left: auto;
        white-space: nowrap;
      }
      ._mark_5dec39 {
        color: var(--lane-color);
      }
      ._spectatorTowers_5dec39 {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        grid-template-rows: repeat(2, minmax(0, 1fr));
        gap: var(--pb-space-2);
      }
      ._spectatorTowers_5dec39 > div {
        min-height: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      ._spectatorTowers_5dec39 b {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: var(--pb-font-caption);
      }
      @media (prefers-reduced-motion: reduce) {
        ._pads_5dec39 button {
          transition: none;
        }
      }
      :root[data-motion='off'] ._pads_5dec39 button {
        transition: none;
      }

      ._stage_ff0b9a {
        gap: var(--pb-space-5);
        min-height: 0;
        color: var(--pb-text);
      }
      ._header_ff0b9a {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: var(--pb-space-5);
      }
      ._header_ff0b9a h1 {
        margin: 0;
        font-size: var(--pb-font-h1);
        line-height: 1.15;
      }
      ._header_ff0b9a p {
        margin: var(--pb-space-2) 0 0;
        color: var(--pb-text-muted);
        font-size: var(--pb-font-body);
      }
      ._timer_ff0b9a {
        font-size: calc(var(--pb-font-display) * 0.75);
        line-height: 1;
        font-weight: 900;
        font-variant-numeric: tabular-nums;
        color: var(--pb-accent-2);
      }
      ._timer_ff0b9a small {
        font-size: var(--pb-font-body);
      }
      ._lanes_ff0b9a {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        grid-template-rows: repeat(2, minmax(0, 1fr));
        gap: var(--pb-space-4);
      }
      ._lanes_ff0b9a[data-count='2'],
      ._lanes_ff0b9a[data-count='3'],
      ._lanes_ff0b9a[data-count='4'] {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      ._lane_ff0b9a {
        min-height: 0;
        display: flex;
        flex-direction: column;
        padding: var(--pb-space-3);
        background: var(--pb-surface);
        border-top: var(--pb-space-1) solid var(--lane-color);
        border-radius: var(--pb-radius);
      }
      ._label_ff0b9a {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: var(--pb-space-2);
        font-size: var(--pb-font-body);
      }
      ._label_ff0b9a b {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      ._label_ff0b9a strong {
        flex: none;
        font-size: var(--pb-font-h2);
        font-variant-numeric: tabular-nums;
      }
      ._label_ff0b9a small {
        font-size: var(--pb-font-body);
      }
      ._tower_ff0b9a {
        flex: 1;
        min-height: 0;
      }
      ._lane_ff0b9a p {
        font-size: var(--pb-font-body);
        line-height: 1.2;
        text-align: center;
        margin: 0;
      }
      ._lane_ff0b9a[data-out] p {
        color: var(--pb-text-muted);
      }

      /* The lane footer carries the readable floor number; SVG annotations are phone-only. */
      ._tower_ff0b9a text {
        display: none;
      }

      ._tower_132d9e {
        display: block;
        width: 100%;
        height: 100%;
        min-height: 0;
      }
      ._column_132d9e {
        fill: var(--pb-surface-2);
      }
      ._safe_132d9e {
        fill: var(--lane-color, var(--pb-accent-3));
      }
      ._danger_132d9e {
        fill: var(--pb-danger);
        stroke: var(--pb-text);
        stroke-width: 0.3;
      }
      ._cross_132d9e {
        stroke: var(--pb-text);
        stroke-width: 2;
        fill: none;
      }
      ._ball_132d9e {
        fill: var(--pb-text);
        stroke: var(--pb-bg);
        stroke-width: 2;
      }
      ._charged_132d9e {
        fill: var(--pb-accent-2);
        stroke: var(--pb-text);
        stroke-width: 3;
      }
      ._arrow_132d9e {
        fill: none;
        stroke: var(--pb-text);
        stroke-width: 2;
      }
      ._floor_132d9e {
        fill: var(--pb-text-muted);
        font-family: var(--pb-font-family);
        font-size: 12px;
        font-weight: 800;
      }

      ._stage_262f13 {
        display: flex;
        flex-direction: column;
        gap: var(--pb-space-5);
        min-height: 100%;
        /* The top is the overscan band unless the host already fills it (T-0179: under the playing
     header, which sits inside the band, the shell sets --pb-stage-top). */
        padding: var(--pb-stage-top, var(--pb-overscan-y, 54px)) var(--pb-overscan-x, 96px)
          var(--pb-overscan-y, 54px);
      }

      ._center_262f13 {
        /* `safe`: a stage taller than its box overflows downward, never up under the roster (a 16-player
     Bingo with the hall board on put its kicker through the third chip row — loop 265). */
        justify-content: safe center;
        align-items: safe center;
        text-align: center;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 390px;
        height: 844px;
        background: var(--pb-bg);
        color: var(--pb-text);
        font-family: var(--pb-font-family);
      }
      body {
        display: flex;
        flex-direction: column;
      }
      #shell {
        height: 64px;
        flex: none;
        padding: var(--pb-space-3);
        font-size: var(--pb-font-body);
        display: flex;
        align-items: center;
      }
      #view {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        padding-bottom: 32px;
      }
      svg {
        max-width: 100%;
      }
    </style>
  </head>
