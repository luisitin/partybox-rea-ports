      /* Design tokens (docs/DESIGN_SYSTEM.md). Every colour, size and duration in the app comes from here.
   Colour tokens are re-declared per theme below (docs/DESIGN_SYSTEM.md → Themes).
   The TV shell and the controller shell each set a type-scale column via `data-surface` (stamped on
   <html> by main.tsx and on the shell element). */
      :root {
        --pb-bg: #0f1020;
        /* ADR-056: how much of the page colour washes over a game's art — the backdrop behind play and
     the key art behind the start stage. Art is drawn for a dark stage; a light theme washes it
     far more, so text drawn on the stage keeps its contrast. */

        --pb-tile-wash: 0%;
        --pb-surface: #1c1e3a;
        --pb-surface-2: #272a52;
        --pb-text: #f5f6ff;
        --pb-text-muted: #b3b7d9;
        --pb-accent: #ff5d8f;
        --pb-accent-2: #ffd166;
        --pb-accent-3: #06d6a0;
        --pb-danger: #ef476f;
        --pb-info: #4cc9f0;
        --pb-focus: #ffd166;
        --pb-on-accent: #1a0b12;
        /* accent-2 as a FILL (VIP pill, letter discs) — stays gold even where accent-2 text darkens */
        --pb-accent-2-fill: #ffd166;
        --pb-on-accent-2-fill: #1a0b12;
        /* optional edge for surfaces; only High Contrast sets it */
        --pb-border: transparent;
        /* the veil behind a pause curtain or a phone sheet: the theme's own ink, never a baked-in night */
        --pb-scrim: rgb(15 16 32 / 62%);

        --pb-player-1: #ff5d8f;
        --pb-player-2: #ffd166;
        --pb-player-3: #06d6a0;
        --pb-player-4: #4cc9f0;
        --pb-player-5: #b388ff;
        --pb-player-6: #ff9f43;
        --pb-player-7: #48dbfb;
        --pb-player-8: #f368e0;

        /* The two teams (P00 §6 TeamBanner, audit #52): Sun follows the theme's accent, Moon its info
     colour. Always shown with the shape (▲ / ●) and the name, never as a tint on a face. */
        --pb-team-sun: var(--pb-accent);
        --pb-team-moon: var(--pb-info);

        --pb-font-family:
          'Nunito Variable', 'Segoe UI Variable Display', 'Segoe UI', system-ui, -apple-system,
          Roboto, 'Helvetica Neue', Arial, sans-serif;
        --pb-font-mono: ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace;

        --pb-space-1: 4px;
        --pb-space-2: 8px;
        --pb-space-3: 12px;
        --pb-space-4: 16px;
        --pb-space-5: 24px;
        --pb-space-6: 32px;
        --pb-space-7: 48px;
        --pb-space-8: 64px;

        --pb-radius: 12px;
        --pb-radius-lg: 24px;
        --pb-touch: 44px;

        --pb-motion-fast: 150ms;
        --pb-motion-base: 300ms;
        --pb-motion-slow: 600ms;
        --pb-motion-pulse: 1000ms;
        --pb-motion-confetti: 3000ms;
        --pb-ease: cubic-bezier(0.2, 0.8, 0.2, 1);

        /* phone column by default; the TV shell overrides. I-100 C: rem, so a phone's "larger text"
     setting scales the words (16 px root = the same sizes as before). */
        --pb-font-display: 3rem;
        --pb-font-h1: 1.75rem;
        --pb-font-h2: 1.375rem;
        --pb-font-body: 1.125rem;
        --pb-font-caption: 0.875rem;
        --pb-font-button: 1.25rem;
        --pb-chip-size: 40px;
      }

      /* ── Themes (src/theme.ts sets data-theme on <html>;
