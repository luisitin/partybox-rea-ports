<!doctype html>
<html lang="en" data-surface="controller" data-motion="off">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Hole Swallow · play · phone-tv</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--pb-bg);
        color: var(--pb-text);
        font-family: var(--pb-font-family);
      }
      body {
        display: flex;
        flex-direction: column;
      }
      body > header,
      body > footer {
        flex: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: var(--pb-space-3) var(--pb-space-4);
        font-size: var(--pb-font-body);
        background: var(--pb-surface);
      }
      body > header {
        height: 60px;
      }
      body > footer {
        height: 44px;
      }
      main {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        padding: 0;
      }
      button {
        font: inherit;
      }
      h1 {
        font-size: inherit;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>PartyBox · Hole Swallow</h1>
      <span>Player 1</span>
    </header>
    <main id="stage">
      <div class="Controller_screen" style="--pb-hole-color: var(--pb-player-1)">
        <header class="Controller_header">
          <span class="Controller_identity" aria-hidden="true">1</span>
          <div class="Controller_heading">
            <h2>You are hole 1</h2>
            <p>Eat what fits. Keep growing.</p>
          </div>
          <strong class="Controller_timer" role="timer" aria-label="30 seconds left">0:30</strong>
        </header>
        <div class="Controller_metrics">
          <div><span>Points</span><strong>266</strong></div>
          <div class="Controller_target">
            <strong>Eat: Towers</strong><span>Big enough for every building!</span>
          </div>
        </div>
        <div class="Controller_control">
          <button
            type="button"
            class="Controller_pad"
            style="--pb-joy-x: 0; --pb-joy-y: 0"
            aria-label="Move your hole"
            aria-describedby="_R_4_"
            aria-keyshortcuts="ArrowUp ArrowDown ArrowLeft ArrowRight"
          >
            <span class="Controller_padRing" aria-hidden="true"></span
            ><span class="Controller_north" aria-hidden="true">↑</span
            ><span class="Controller_east" aria-hidden="true">→</span
            ><span class="Controller_south" aria-hidden="true">↓</span
            ><span class="Controller_west" aria-hidden="true">←</span
            ><span class="Controller_thumb" aria-hidden="true"><span></span></span>
          </button>
          <p class="Controller_padHint" id="_R_4_">
            Drag to steer · Release to stop · Arrow keys work too
          </p>
        </div>
      </div>
    </main>
    <footer><span>90-second city</span><span>Connected</span></footer>
  </body>
</html>
